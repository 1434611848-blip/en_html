<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 单词大冒险 - 中考核心词汇闯关</title>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#6C5CE7;--primary-light:#A29BFE;--secondary:#FD79A8;--accent:#00CEC9;
  --success:#00B894;--warning:#FDCB6E;--danger:#E17055;--bg:#FFF8F0;
  --card-bg:#FFFFFF;--text:#2D3436;--text-light:#636E72;--text-lighter:#B2BEC3;
  --shadow:0 4px 20px rgba(108,92,231,0.1);--shadow-lg:0 10px 40px rgba(108,92,231,0.15);
  --radius:16px;--radius-sm:10px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}
.bg-decor{position:fixed;pointer-events:none;z-index:0;opacity:0.06}
.bg-decor.c1{top:-100px;right:-100px;width:400px;height:400px;background:var(--primary);border-radius:50%}
.bg-decor.c2{bottom:-80px;left:-80px;width:300px;height:300px;background:var(--secondary);border-radius:50%}
.bg-decor.c3{top:50%;left:50%;width:200px;height:200px;background:var(--accent);border-radius:50%;transform:translate(-50%,-50%)}
.app-container{max-width:900px;margin:0 auto;padding:12px;position:relative;z-index:1}
.app-header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.app-header .logo{display:flex;align-items:center;gap:8px;font-size:1.3em;font-weight:700}
.app-header .logo .icon{font-size:1.6em}
.user-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user-bar .badge{background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:20px;font-size:0.85em;backdrop-filter:blur(10px)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:25px;font-size:0.95em;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(0.95)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#5A4BD1;box-shadow:0 4px 15px rgba(108,92,231,0.4)}
.btn-secondary{background:var(--secondary);color:#fff}.btn-secondary:hover{background:#E8698F;box-shadow:0 4px 15px rgba(253,121,168,0.4)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#00B5B0;box-shadow:0 4px 15px rgba(0,206,201,0.4)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#D63031;box-shadow:0 4px 15px rgba(225,112,85,0.4)}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary);color:#fff}
.btn-sm{padding:6px 14px;font-size:0.8em}.btn-xs{padding:4px 10px;font-size:0.75em}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);transition:var(--transition)}
.card:hover{box-shadow:var(--shadow-lg)}
.card-title{font-size:1.15em;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.screen{display:none}.screen.active{display:block;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.05)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-200px) rotate(720deg);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes correctGlow{0%{box-shadow:0 0 0 0 rgba(0,184,148,0.6)}70%{box-shadow:0 0 0 20px rgba(0,184,148,0)}100%{box-shadow:0 0 0 0 rgba(0,184,148,0)}}
@keyframes starBurst{0%{transform:scale(0) rotate(0);opacity:1}100%{transform:scale(1.5) rotate(180deg);opacity:0}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes popIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.correct-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4em;z-index:250;pointer-events:none;animation:starBurst 0.8s ease-out forwards}
.achievement-card{position:fixed;top:0;left:0;width:100%;height:100%;z-index:400;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;animation:fadeIn 0.3s ease}
.achievement-card .card-inner{background:linear-gradient(145deg,#FFFFFF,#FFF8F0);border-radius:20px;padding:24px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(108,92,231,0.3);animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;overflow:hidden}
.achievement-card .card-inner::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(108,92,231,0.08) 50%,transparent 60%);background-size:200% 200%;animation:shimmer 3s ease-in-out infinite}
.achievement-card .card-badge{font-size:4em;animation:float 2s ease-in-out infinite}
.achievement-card .card-score{font-size:2.5em;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0}
.achievement-card .card-detail{font-size:0.85em;color:var(--text-light);margin:4px 0}
.achievement-card .card-teacher{display:inline-flex;align-items:center;gap:6px;background:rgba(108,92,231,0.1);padding:6px 14px;border-radius:16px;font-size:0.85em;color:var(--primary);margin:8px 0;font-weight:600}
.achievement-card .card-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.achievement-card .screenshot-tip{font-size:0.75em;color:var(--text-lighter);margin-top:8px;animation:slideUp 0.6s ease 0.5s both}
.screen-flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:199;pointer-events:none;animation:fadeIn 0.15s ease}
.login-container{max-width:420px;margin:40px auto}
.login-tabs{display:flex;gap:0;margin-bottom:20px}
.login-tab{flex:1;padding:12px;text-align:center;background:#fff;border:2px solid #E0E0E0;cursor:pointer;font-weight:600;font-size:0.95em;transition:var(--transition)}
.login-tab:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.login-tab:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.login-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-form input,.login-form select{padding:12px 16px;border:2px solid #E0E0E0;border-radius:var(--radius-sm);font-size:0.95em;transition:var(--transition);background:#FAFAFA}
.login-form input:focus,.login-form select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(108,92,231,0.1)}
.login-form label{font-weight:600;font-size:0.9em;color:var(--text-light)}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.word-card{background:#fff;border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;border:2px solid #F0F0F0;transition:var(--transition);position:relative;overflow:hidden}
.word-card:hover{border-color:var(--primary-light);transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,92,231,0.15)}
.word-card:active{transform:scale(0.97)}
.word-card .word{font-size:1.2em;font-weight:700;color:var(--primary);margin-bottom:4px}
.word-card .phonetic{font-size:0.75em;color:var(--text-light);margin-bottom:4px}
.word-card .pos{font-size:0.75em;color:var(--accent);font-weight:600}
.word-card .meaning{font-size:0.85em;color:var(--text);margin-top:4px}
.word-card .speaker-icon{position:absolute;top:8px;right:8px;font-size:1em;opacity:0.5;transition:var(--transition)}
.word-card:hover .speaker-icon{opacity:1}
.word-card.playing{border-color:var(--accent);animation:pulse 0.6s ease}
.quiz-container{max-width:600px;margin:0 auto}
.quiz-progress{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-weight:600;font-size:0.9em;color:var(--text-light)}
.quiz-progress .bar{flex:1;height:8px;background:#F0F0F0;border-radius:4px;overflow:hidden}
.quiz-progress .bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width 0.5s ease}
.quiz-question{background:#fff;border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.quiz-question .q-label{font-size:0.85em;color:var(--text-light);background:#F8F8F8;padding:4px 12px;border-radius:12px}
.quiz-question .q-word{font-size:2em;font-weight:700;color:var(--primary)}
.quiz-question .q-meaning{font-size:1.3em;color:var(--text)}
.quiz-question .listen-btn{width:60px;height:60px;border-radius:50%;border:none;background:var(--primary-light);color:#fff;font-size:1.5em;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.quiz-question .listen-btn:hover{background:var(--primary);transform:scale(1.1)}
.quiz-question .listen-btn.playing{animation:pulse 0.8s infinite}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quiz-option{padding:14px;border:2px solid #E0E0E0;border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-size:0.95em;text-align:center;transition:var(--transition);font-weight:500}
.quiz-option:hover{border-color:var(--primary-light);background:#F8F6FF}
.quiz-option:active{transform:scale(0.97)}
.quiz-option.correct{border-color:var(--success);background:#E6FFF8;color:var(--success);animation:bounceIn 0.5s}
.quiz-option.wrong{border-color:var(--danger);background:#FFF0ED;color:var(--danger);animation:shake 0.5s}
.quiz-option.disabled{pointer-events:none;opacity:0.7}
.quiz-input{width:100%;padding:14px;border:2px solid #E0E0E0;border-radius:var(--radius-sm);font-size:1.1em;text-align:center;transition:var(--transition)}
.quiz-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,92,231,0.1)}
.quiz-input.correct{border-color:var(--success);background:#E6FFF8}
.quiz-input.wrong{border-color:var(--danger);background:#FFF0ED}
.quiz-feedback{text-align:center;padding:12px;border-radius:var(--radius-sm);font-weight:600;margin-top:12px;display:none}
.quiz-feedback.show{display:block;animation:bounceIn 0.4s}
.quiz-feedback.correct-glow{box-shadow:0 0 30px rgba(0,184,148,0.4)}
.quiz-feedback.correct{background:#E6FFF8;color:var(--success)}
.quiz-feedback.wrong{background:#FFF0ED;color:var(--danger)}
.progress-map{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0}
.map-node{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7em;font-weight:700;cursor:pointer;transition:var(--transition);position:relative}
.map-node.completed{background:var(--success);color:#fff}
.map-node.current{background:var(--primary);color:#fff;animation:pulse 2s infinite;box-shadow:0 0 15px rgba(108,92,231,0.5)}
.map-node.locked{background:#E0E0E0;color:#B2BEC3}
.map-node:hover{transform:scale(1.2);z-index:2}
.rank-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-weight:700;font-size:0.9em;animation:bounceIn 0.6s}
.rank-bronze{background:linear-gradient(135deg,#CD7F32,#DEB887);color:#fff}
.rank-silver{background:linear-gradient(135deg,#C0C0C0,#E8E8E8);color:#333}
.rank-gold{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff}
.rank-diamond{background:linear-gradient(135deg,#00CEC9,#0984E3);color:#fff}
.rank-king{background:linear-gradient(135deg,#E17055,#FD79A8,#6C5CE7);color:#fff}
.streak-display{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1em}
.streak-fire{font-size:1.5em;animation:float 2s ease-in-out infinite}
.teacher-panel .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--radius-sm);padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-card .stat-value{font-size:1.8em;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:0.8em;color:var(--text-light);margin-top:4px}
.student-table{width:100%;border-collapse:collapse;font-size:0.85em}
.student-table th,.student-table td{padding:10px 8px;text-align:left;border-bottom:1px solid #F0F0F0}
.student-table th{background:#F8F6FF;font-weight:600;color:var(--primary);position:sticky;top:0}
.student-table tr:hover{background:#F8F6FF}
.table-wrap{overflow-x:auto;max-height:400px;overflow-y:auto;border-radius:var(--radius-sm);border:1px solid #F0F0F0}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s ease}
.modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:bounceIn 0.4s ease}
.modal h3{margin-bottom:16px;font-size:1.2em}
.modal textarea{width:100%;min-height:150px;padding:12px;border:2px solid #E0E0E0;border-radius:var(--radius-sm);font-size:0.9em;resize:vertical;font-family:inherit}
.modal textarea:focus{outline:none;border-color:var(--primary)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.result-container{text-align:center;padding:30px 0}
.result-icon{font-size:4em;animation:bounceIn 0.6s ease}
.result-title{font-size:1.6em;font-weight:700;margin:12px 0}
.result-score{font-size:3em;font-weight:700;color:var(--primary);margin:8px 0}
.result-detail{color:var(--text-light);margin-bottom:20px}
.confetti-piece{position:fixed;z-index:200;pointer-events:none;font-size:1.5em;animation:confetti 1.5s ease-out forwards}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;padding:12px 24px;border-radius:25px;color:#fff;font-weight:600;font-size:0.9em;box-shadow:0 4px 20px rgba(0,0,0,0.2);animation:bounceIn 0.4s ease}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}.toast.info{background:var(--primary)}
@media(max-width:600px){
  .app-header{padding:12px 16px}.app-header .logo{font-size:1.1em}
  .word-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .word-card{padding:12px}.word-card .word{font-size:1em}
  .quiz-options{grid-template-columns:1fr}
  .quiz-question .q-word{font-size:1.5em}
  .student-table{font-size:0.75em}.student-table th,.student-table td{padding:6px 4px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .map-node{width:30px;height:30px;font-size:0.6em}
}
.tabs{display:flex;gap:0;margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 18px;border:none;background:#fff;cursor:pointer;font-weight:600;font-size:0.85em;border-bottom:3px solid transparent;white-space:nowrap;transition:var(--transition);color:var(--text-light)}
.tab.active{border-bottom-color:var(--primary);color:var(--primary)}.tab:hover{color:var(--primary)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}.empty-state .icon{font-size:3em;margin-bottom:12px}
.inline-form{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.inline-form input{flex:1;min-width:120px;padding:10px 14px;border:2px solid #E0E0E0;border-radius:20px;font-size:0.9em}
.inline-form input:focus{outline:none;border-color:var(--primary)}
.search-input{width:100%;padding:10px 16px;border:2px solid #E0E0E0;border-radius:20px;font-size:0.9em;margin-bottom:12px}
.search-input:focus{outline:none;border-color:var(--primary)}
.class-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.class-tag{padding:6px 14px;border-radius:16px;font-size:0.8em;cursor:pointer;border:2px solid #E0E0E0;background:#fff;transition:var(--transition);font-weight:500}
.class-tag.active{background:var(--primary);color:#fff;border-color:var(--primary)}.class-tag:hover{border-color:var(--primary-light)}
.day-info{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 16px;background:linear-gradient(135deg,#F8F6FF,#FFF0F5);border-radius:var(--radius-sm);flex-wrap:wrap}
.day-info .day-num{font-size:1.5em;font-weight:700;color:var(--primary)}
.day-info .day-label{font-size:0.85em;color:var(--text-light)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#B0B0B0}

</style>
</head>
<body>
<div class="bg-decor c1"></div><div class="bg-decor c2"></div><div class="bg-decor c3"></div>
<div class="app-container" id="appContainer">
<header class="app-header" id="appHeader"><div class="logo"><span class="icon">🌟</span>单词大冒险</div><div class="user-bar" id="userBar"></div></header>
<div class="screen active" id="loginScreen"></div>
<div class="screen" id="studentDashboard"></div>
<div class="screen" id="learnScreen"></div>
<div class="screen" id="quizScreen"></div>
<div class="screen" id="resultScreen"></div>
<div class="screen" id="teacherDashboard"></div>
</div>
<div id="modalContainer"></div>
<div id="toastContainer"></div>
<script>
// ==================== WORD DATA (672 words) ====================
const allWords = [

{id:11,word:'active',phonetic:'[\'æktɪv]',pos:'adj.',meaning:'主动的；有效的；积极的；活跃的；现役的 n.主动语态；积极分子'},
{id:12,word:'actual',phonetic:'[\'æktʃuəl]',pos:'adj.',meaning:'真实的，实际的'},
{id:13,word:'actually',phonetic:'[\'æktʃuəli]',pos:'adv.',meaning:'事实上，实际上'},
{id:14,word:'add',phonetic:'[æd]',pos:'v.',meaning:'添加，增添'},

{id:19,word:'advice',phonetic:'[ədˈvaɪs]',pos:'n.',meaning:'忠告；劝告；建议'},
{id:20,word:'advise',phonetic:'[ədˈvaɪz]',pos:'v.',meaning:'建议; 劝告, 告知'},
{id:21,word:'affect',phonetic:'[əˈfekt]',pos:'v.',meaning:'影响；感动；作用'},

// ==================== SOUND EFFECTS ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let _audioCtx = null;

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new AudioCtx();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

// Play a cheerful "correct" sound using Web Audio API (no external files needed)
function playCorrectSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    // Rising three-note chime: C5 -> E5 -> G5
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.12);
      gain.gain.setValueAtTime(0, now + i * 0.12);
      gain.gain.linearRampToValueAtTime(0.3, now + i * 0.12 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.4);
    });
  } catch(e) { /* silently ignore audio errors */ }
}

// Play a gentle "wrong" sound
function playWrongSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.linearRampToValueAtTime(180, now + 0.2);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  } catch(e) {}
}

// Play a celebratory fanfare for completing the day
function playFanfareSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const melody = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    melody.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i % 2 === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.15);
      gain.gain.setValueAtTime(0, now + i * 0.15);
      gain.gain.linearRampToValueAtTime(0.25, now + i * 0.15 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.15);
      osc.stop(now + i * 0.15 + 0.5);
    });
  } catch(e) {}
}

// ==================== SPEECH ====================
// Audio playback - using Youdao online TTS (reliable, works in all browsers)
let _currentAudio = null;

function speakWord(word) {
  // Stop any currently playing audio immediately
  if (_currentAudio) {
    _currentAudio.pause();
    _currentAudio.currentTime = 0;
    _currentAudio = null;
  }
  
  return new Promise((resolve) => {
    const audio = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=0');
    audio.volume = 1;
    _currentAudio = audio;
    
    audio.onended = () => { _currentAudio = null; resolve(); };
    audio.onerror = () => { _currentAudio = null; resolve(); };
    audio.play().catch(() => { _currentAudio = null; resolve(); });
    
    // Safety timeout
    setTimeout(() => { if (_currentAudio === audio) { _currentAudio = null; } resolve(); }, 8000);
  });
}

// ==================== UI HELPERS ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function showToast(msg, type) {
  type = type || 'info';
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; }, 2000);
  setTimeout(() => t.remove(), 2500);
}

function showModal(title, content, actions) {
  const c = document.getElementById('modalContainer');
  c.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${title}</h3><div>${content}</div><div class="modal-actions">${actions}</div></div></div>`;
}

function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function updateHeader() {
  const user = getCurrentUser();
  const bar = document.getElementById('userBar');
  if (!user) { bar.innerHTML = ''; return; }
  const roleLabel = user.role === 'teacher' ? '👩‍🏫 老师' : '🎒 学员';
  bar.innerHTML = `<span class="badge">${roleLabel}: ${user.name}</span><button class="btn btn-outline btn-xs" onclick="handleLogout()">退出</button>`;
}

function handleLogout() {
  if (confirm('确定要退出登录吗？')) {
    clearCurrentUser(); updateHeader(); showLoginScreen(); showToast('已退出登录');
  }
}

// ==================== HELPERS ====================
function shuffle(arr) { const a = [...arr]; for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function getLevelWords(level) { const s = level * WORDS_PER_LEVEL; return allWords.slice(s, s + WORDS_PER_LEVEL); }

function getRandomDistractors(correct, pool, count) {
  const avail = pool.filter(w => w.word !== correct.word && w.meaning !== correct.meaning);
  return shuffle([...avail]).slice(0, count);
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

      <div class="login-tab ${loginRole==='teacher'?'active':''}" onclick="switchLoginRole('teacher')">👩‍🏫 老师登录</div>
    </div>
    <div class="login-form" id="loginForm"></div>
    <div style="margin-top:16px"><button class="btn btn-danger btn-sm" onclick="resetAllData()">🗑️ 重置全部数据</button></div>
  </div></div>`;
  renderLoginForm();
}

function switchLoginRole(role) {
  loginRole = role;
  document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderLoginForm();
}

function renderLoginForm() {
  const form = document.getElementById('loginForm');
  const data = loadData();
  if (loginRole === 'student') {
    const teachers = Object.keys(data.teachers || {});
    if (teachers.length === 0) {
      form.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>还没有老师注册</p><p style="font-size:0.8em;color:var(--text-lighter)">请先让老师注册账号</p><button class="btn btn-primary" onclick="switchLoginRole('teacher')" style="margin-top:12px">切换到老师注册</button></div>`;
      return;
    }
    const opts = teachers.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    form.innerHTML = `<label>选择老师</label><select id="loginTeacher"><option value="">请选择老师</option>${opts}</select><label>学员姓名</label><input type="text" id="loginStudentName" placeholder="输入你的姓名"><button class="btn btn-primary" onclick="studentLogin()" style="width:100%;justify-content:center;margin-top:8px">🚀 开始冒险</button>`;
  } else {
    const data = loadData();
    const hasAnyTeacher = data.teachers && Object.keys(data.teachers).length > 0;
    const title = hasAnyTeacher ? '老师登录' : '老师注册';
    form.innerHTML = `<label>老师姓名</label><input type="text" id="loginTeacherName" placeholder="输入老师姓名"><label>${hasAnyTeacher ? '输入密码' : '设置密码'}</label><input type="password" id="loginTeacherPwd" placeholder="${hasAnyTeacher ? '输入登录密码' : '设置登录密码（6位以上）'}"><button class="btn btn-primary" onclick="teacherLogin()" style="width:100%;justify-content:center;margin-top:8px">👩‍🏫 ${hasAnyTeacher ? '登录' : '注册'}</button>`;
  }
}

function teacherLogin() {
  const name = document.getElementById('loginTeacherName').value.trim();
  const pwd = document.getElementById('loginTeacherPwd').value.trim();
  if (!name) { showToast('请输入姓名', 'error'); return; }
  if (!pwd) { showToast('请输入密码', 'error'); return; }
  const data = loadData();
  if (!data.teachers) data.teachers = {};
  // Existing teacher: verify password
  if (data.teachers[name]) {
    if (data.teachers[name].password !== pwd) {
      showToast('密码错误，请重试', 'error');
      return;
    }
  } else {
    // New teacher registration: require password length
    if (pwd.length < 6) {
      showToast('密码至少需要6位', 'error');
      return;
    }
    data.teachers[name] = { password: pwd, createdAt: new Date().toISOString() };
    if (!data.students) data.students = {};
    data.students[name] = {};
    saveData(data);
    setCurrentUser({ role: 'teacher', name: name });
    updateHeader(); showTeacherDashboard();
    showToast('注册成功！欢迎，' + name + '老师！', 'success');
    return;
  }
  saveData(data);
  setCurrentUser({ role: 'teacher', name: name });
  updateHeader(); showTeacherDashboard();
  showToast('欢迎，' + name + '老师！', 'success');
}

function studentLogin() {
  const teacher = document.getElementById('loginTeacher').value;
  const name = document.getElementById('loginStudentName').value.trim();
  if (!teacher || !name) { showToast('请选择老师并输入姓名', 'error'); return; }
  const data = loadData();
  // Check if student exists in teacher's imported list
  if (!data.students || !data.students[teacher] || !data.students[teacher][name]) {
    showToast('学员不存在，请联系老师导入你的姓名', 'error'); return;
  }
  setCurrentUser({ role: 'student', name: name, teacher: teacher });
  updateHeader(); showStudentDashboard();
  showToast('欢迎，' + name + '！加油！💪', 'success');
}

function resetAllData() {

// ==================== STUDENT DASHBOARD ====================
function showStudentDashboard() {
  const user = getCurrentUser();
  if (!user || user.role !== 'student') { showLoginScreen(); return; }
  showScreen('studentDashboard');
  const data = loadData();
  const student = data.students[user.teacher]?.[user.name];
  if (!student) { showToast('学员数据异常', 'error'); handleLogout(); return; }
  const rank = getRank(student.streak || 0);
  const level = student.level || 0;
  const today = new Date().toDateString();
  const studiedToday = student.lastStudyDate === today;
  let mapHtml = '<div class="progress-map">';
  const startL = Math.max(0, level - 5);
  const endL = Math.min(TOTAL_LEVELS, level + 10);
  for (let i = startL; i < endL; i++) {
    let cls = 'locked'; if (i < level) cls = 'completed'; else if (i === level) cls = 'current';
    mapHtml += `<div class="map-node ${cls}" title="第${i+1}关">${i+1}</div>`;
  }
  mapHtml += '</div>';
  const currentWords = getLevelWords(level);
  const el = document.getElementById('studentDashboard');
  el.innerHTML = `<div class="card" style="text-align:center">
    <div class="streak-display" style="justify-content:center"><span class="streak-fire">🔥</span><span>连续打卡 <strong>${student.streak||0}</strong> 天</span></div>
    <div style="margin:8px 0"><span class="rank-badge ${rank.class}">${rank.icon} ${rank.name}段位</span></div>
    <div style="font-size:0.85em;color:var(--text-light);margin-top:4px">已学 <strong>${level*WORDS_PER_LEVEL}</strong> / ${allWords.length} 个单词</div>
  </div>
  <div class="card"><div class="card-title">🗺️ 闯关地图</div>${mapHtml}<div style="text-align:center;margin-top:8px;font-size:0.8em;color:var(--text-light)">当前：第 <strong>${level+1}</strong> 关 / 共 ${TOTAL_LEVELS} 关</div></div>
  <div class="card">
    <div class="day-info"><div class="day-num">第 ${level+1} 关</div><div class="day-label">${studiedToday?'✅ 今日已完成':'📝 今日待挑战'}</div></div>
    <p style="font-size:0.85em;color:var(--text-light);margin-bottom:12px">本关单词：${currentWords.map(w=>w.word).join('、')}</p>
    ${level>=TOTAL_LEVELS?'<div style="text-align:center;font-size:1.2em;padding:20px">🎉 恭喜！你已完成全部单词！</div>':studiedToday?`<button class="btn btn-outline" onclick="showLearnScreen()" style="width:100%;justify-content:center">📖 复习今日单词</button>`:`<button class="btn btn-primary" onclick="showLearnScreen()" style="width:100%;justify-content:center">🚀 开始今日闯关</button>`}
  </div>`;
}

// ==================== LEARN SCREEN ====================
let currentLearnLevel = 0;

function showLearnScreen() {
  const user = getCurrentUser();
  if (!user || user.role !== 'student') { showLoginScreen(); return; }
  const data = loadData();
  const student = data.students[user.teacher]?.[user.name];
  currentLearnLevel = student.level || 0;
  if (currentLearnLevel >= TOTAL_LEVELS) { showToast('已完成全部关卡！', 'info'); showStudentDashboard(); return; }
  showScreen('learnScreen');
  const words = getLevelWords(currentLearnLevel);
  let wh = '<div class="word-grid">';
  words.forEach(w => {
    wh += `<div class="word-card" onclick="playWordCard('${w.word.replace(/'/g,"\\'")}',this)" title="点击听发音"><span class="speaker-icon">🔊</span><div class="word">${w.word}</div><div class="phonetic">${w.phonetic}</div><div class="pos">${w.pos}</div><div class="meaning">${w.meaning}</div></div>`;
  });
  wh += '</div>';
  document.getElementById('learnScreen').innerHTML = `<div class="card"><div class="card-title">📖 第 ${currentLearnLevel+1} 关 - 学习单词</div><p style="font-size:0.85em;color:var(--text-light);margin-bottom:12px">💡 点击单词卡片听发音，记住后开始检测</p>${wh}<div style="text-align:center;margin-top:16px;display:flex;gap:10px;justify-content:center"><button class="btn btn-outline" onclick="showStudentDashboard()">← 返回</button><button class="btn btn-primary" onclick="startQuiz()">✅ 开始检测</button></div></div>`;
}

async function playWordCard(word, cardEl) {
  if (cardEl) { cardEl.classList.add('playing'); setTimeout(() => cardEl.classList.remove('playing'), 600); }
  speakWord(word); // silently handle errors inside speakWord
}

// ==================== QUIZ SCREEN ====================
let quizState = null;

function startQuiz(retryWords) {
  let words;
  if (retryWords && retryWords.length > 0) {
    // Retry mode: only quiz the wrong words
    words = retryWords;
  } else {
    words = getLevelWords(currentLearnLevel);
  }
  const pool = allWords.filter(w => !words.find(ww => ww.id === w.id));
  let questions = [];
  words.forEach((word, idx) => {
    let distractors = getRandomDistractors(word, pool, 3);
    let opts = shuffle([word.meaning, ...distractors.map(d => d.meaning)]);
    questions.push({ type: 'en2cn', word, question: word.word, display: word.word, options: opts, answer: word.meaning });
    if (idx % 2 === 0) {
      distractors = getRandomDistractors(word, pool, 3);
      opts = shuffle([word.word, ...distractors.map(d => d.word)]);
      questions.push({ type: 'cn2en', word, question: word.meaning, display: word.meaning, options: opts, answer: word.word });
    } else {
      questions.push({ type: 'spell', word, question: word.meaning, display: word.meaning, answer: word.word });
    }
  });
  quizState = { level: currentLearnLevel, questions: shuffle(questions), currentQ: 0, score: 0, answers: [], wrongWords: [], retryCount: (retryWords ? 1 : 0) };
  showScreen('quizScreen');
  renderQuizQuestion();
}

function renderQuizQuestion() {
  if (!quizState || quizState.currentQ >= quizState.questions.length) { finishQuiz(); return; }
  const q = quizState.questions[quizState.currentQ];
  const prog = (quizState.currentQ / quizState.questions.length) * 100;
  let qHtml = '', optHtml = '';
  if (q.type === 'en2cn') {
    qHtml = `<div class="q-label">📖 选择正确的中文意思</div><div class="q-word">${q.display}</div><button class="listen-btn" onclick="playQuizWord()" title="听发音">🔊</button>`;
    optHtml = q.options.map(o => `<div class="quiz-option" onclick="answerQuiz('${o.replace(/'/g,"\\'")}',this)">${o}</div>`).join('');
  } else if (q.type === 'cn2en') {
    qHtml = `<div class="q-label">🔤 选择正确的英文单词</div><div class="q-meaning">${q.display}</div>`;
    optHtml = q.options.map(o => `<div class="quiz-option" onclick="answerQuiz('${o.replace(/'/g,"\\'")}',this)">${o}</div>`).join('');
  } else {
    qHtml = `<div class="q-label">✍️ 拼写单词</div><div class="q-meaning">${q.display}</div><button class="listen-btn" onclick="playQuizWord()" title="听发音">🔊</button>`;
    optHtml = `<div style="display:flex;gap:8px"><input type="text" class="quiz-input" id="spellInput" placeholder="输入英文拼写..." autocomplete="off" onkeydown="if(event.key==='Enter')submitSpell()"><button class="btn btn-primary" onclick="submitSpell()">确认</button></div>`;
  }
  document.getElementById('quizScreen').innerHTML = `<div class="quiz-container"><div class="quiz-progress"><span>第 ${quizState.currentQ+1}/${quizState.questions.length} 题</span><div class="bar"><div class="fill" style="width:${prog}%"></div></div><span>${quizState.score} ✅</span></div><div class="quiz-question">${qHtml}</div><div class="quiz-options" id="quizOptions">${optHtml}</div><div class="quiz-feedback" id="quizFeedback"></div></div>`;
  setTimeout(() => { const inp = document.getElementById('spellInput'); if (inp) inp.focus(); }, 100);
}

function playQuizWord() {
  if (!quizState) return;
  const q = quizState.questions[quizState.currentQ];
  const btn = document.querySelector('.listen-btn');
  if (btn) btn.classList.add('playing');
  speakWord(q.word.word).finally(() => { if (btn) btn.classList.remove('playing'); });
}

function answerQuiz(answer, el) {
  if (!quizState) return;
  const q = quizState.questions[quizState.currentQ];
  const correct = answer === q.answer;
  document.querySelectorAll('.quiz-option').forEach(o => o.classList.add('disabled'));
  if (correct) {
    el.classList.add('correct');
    quizState.score++;
    playCorrectSound();
    spawnCorrectFlash(el);
  }
  else {
    el.classList.add('wrong');
    playWrongSound();
    document.querySelectorAll('.quiz-option').forEach(o => { if (o.textContent.trim()===q.answer) o.classList.add('correct'); });
    // Track wrong word for retry
    if (!quizState.wrongWords) quizState.wrongWords = [];
    if (!quizState.wrongWords.find(w => w.id === q.word.id)) {
      quizState.wrongWords.push(q.word);
    }
  }
  quizState.answers.push({ correct, word: q.word });
  const fb = document.getElementById('quizFeedback');
  fb.className = 'quiz-feedback show ' + (correct?'correct':'wrong');
  fb.textContent = correct ? '✅ 正确！太棒了！' : `❌ 错误！正确答案：${q.answer}`;
  setTimeout(() => { quizState.currentQ++; renderQuizQuestion(); }, 1200);
}

// Spawn a star/flash effect at the correct answer position
function spawnCorrectFlash(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const emojis = ['⭐','✨','💫','🌟','💡'];
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const star = document.createElement('div');
      star.className = 'confetti-piece';
      star.textContent = emojis[i];
      star.style.left = (cx + (Math.random() - 0.5) * 80) + 'px';
      star.style.top = (cy + (Math.random() - 0.5) * 40) + 'px';
      star.style.fontSize = (1.2 + Math.random() * 1) + 'em';
      star.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 2000);
    }, i * 60);
  }
  // Brief green flash overlay
  const flash = document.createElement('div');
  flash.className = 'screen-flash';
  flash.style.background = 'rgba(0,184,148,0.08)';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 200);
}

function submitSpell() {
  const inp = document.getElementById('spellInput');
  if (!inp) return;
  const answer = inp.value.trim();
  if (!answer) { showToast('请输入单词拼写', 'error'); return; }
  const q = quizState.questions[quizState.currentQ];
  const correct = answer.toLowerCase() === q.answer.toLowerCase();
  inp.classList.add(correct?'correct':'wrong'); inp.disabled = true;
  const btn = document.querySelector('#quizOptions .btn-primary');
  if (btn) btn.disabled = true;
  if (correct) {
    quizState.score++;
    playCorrectSound();
    const rect = inp.getBoundingClientRect();
    const star = document.createElement('div');
    star.className = 'correct-flash';
    star.textContent = '⭐';
    star.style.left = (rect.left + rect.width / 2) + 'px';
    star.style.top = (rect.top + rect.height / 2) + 'px';
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 1000);
  } else {
    playWrongSound();
    // Track wrong word for retry
    if (!quizState.wrongWords) quizState.wrongWords = [];
    if (!quizState.wrongWords.find(w => w.id === q.word.id)) {
      quizState.wrongWords.push(q.word);
    }
  }
  quizState.answers.push({ correct, word: q.word });
  const fb = document.getElementById('quizFeedback');
  fb.className = 'quiz-feedback show ' + (correct?'correct':'wrong');
  fb.textContent = correct ? '✅ 拼写正确！' : `❌ 正确答案：${q.answer}`;
  setTimeout(() => { quizState.currentQ++; renderQuizQuestion(); }, 1500);
}

function finishQuiz() {
  const total = quizState.questions.length;
  const score = quizState.score;
  const allCorrect = score === total;
  showScreen('resultScreen');
  if (allCorrect) {
    const user = getCurrentUser();
    const data = loadData();
    const student = data.students[user.teacher][user.name];
    const today = new Date().toDateString();
    const yesterday = new Date(Date.now()-86400000).toDateString();
    student.level = (student.level||0) + 1;
    student.totalWords = (student.totalWords||0) + WORDS_PER_LEVEL;
    student.lastStudyDate = today;
    if (student.lastStreakDate === yesterday || student.lastStreakDate === today) { student.streak = (student.streak||0) + 1; }
    else if (student.lastStreakDate !== today) { student.streak = 1; }
    student.lastStreakDate = today;
    saveData(data);
    // Play fanfare and show confetti
    playFanfareSound();
    spawnConfetti();
    // Show the result in resultScreen briefly, then show achievement card
    document.getElementById('resultScreen').innerHTML = `<div class="result-container"><div class="result-icon">🎉</div><div class="result-title">闯关成功！</div><div class="result-score">${score}/${total}</div><div class="result-detail">正确率 ${Math.round(score/total*100)}%</div></div>`;
    // Show achievement card after a short delay
    setTimeout(() => showAchievementCard(score, total, student), 800);
  } else {
    // Not 100% correct: auto-retry with wrong words
    const wrongWords = quizState.wrongWords || [];
    const retryCount = quizState.retryCount || 0;
    if (wrongWords.length > 0) {
      document.getElementById('resultScreen').innerHTML = `<div class="result-container">
        <div class="result-icon">🔄</div>
        <div class="result-title">继续加油！</div>
        <div class="result-score">${score}/${total}</div>
        <div class="result-detail">正确率 ${Math.round(score/total*100)}% · 还有 <strong style="color:var(--danger)">${wrongWords.length}</strong> 个单词需要巩固</div>
        <div style="margin:12px 0;padding:12px;background:#FFF8F0;border-radius:var(--radius-sm);text-align:left">
          <p style="font-size:0.85em;color:var(--text-light);margin-bottom:6px">📝 需要巩固的单词：</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${wrongWords.map(w => `<span style="background:#FFE0E0;padding:4px 10px;border-radius:12px;font-size:0.8em;font-weight:600;color:var(--danger)">${escapeHtml(w.word)}</span>`).join('')}
          </div>
        </div>
        <p style="font-size:0.85em;color:var(--text-light);margin-bottom:8px">${retryCount > 0 ? `第 ${retryCount + 1} 次重测中...` : '系统将自动进入错题重测，直到全部答对才能通关！'}</p>
        <div style="margin-top:16px">
          <button class="btn btn-primary" onclick="retryWrongWords()">🔄 重测错题</button>
          <button class="btn btn-outline" onclick="showLearnScreen()" style="margin-left:8px">📖 回去学习</button>
        </div>
      </div>`;
      // Auto-retry after 2 seconds
      setTimeout(() => {
        if (document.getElementById('resultScreen').style.display !== 'none' || document.getElementById('resultScreen').classList.contains('active')) {
          retryWrongWords();
        }
      }, 2500);
    } else {
      // Edge case: no wrong words tracked but score != total (shouldn't normally happen)
      document.getElementById('resultScreen').innerHTML = `<div class="result-container"><div class="result-icon">😢</div><div class="result-title">还需努力！</div><div class="result-score">${score}/${total}</div><div class="result-detail">正确率 ${Math.round(score/total*100)}%</div><div style="margin-top:16px;display:flex;gap:10px;justify-content:center"><button class="btn btn-outline" onclick="showLearnScreen()">📖 重新学习</button><button class="btn btn-primary" onclick="startQuiz()">🔄 再次检测</button></div></div>`;
    }
  }
}

function retryWrongWords() {
  const wrongWords = quizState.wrongWords || [];
  if (wrongWords.length === 0) {
    showToast('没有需要重测的单词', 'info');
    return;
  }
  startQuiz(wrongWords);
}

// ==================== ACHIEVEMENT CARD ====================
function showAchievementCard(score, total, student) {
  const user = getCurrentUser();
  const rank = getRank(student.streak || 0);
  const pct = Math.round(score / total * 100);
  const today = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  const levelNum = student.level || 0;
  
  const overlay = document.createElement('div');
  overlay.className = 'achievement-card';
  overlay.id = 'achievementOverlay';
  overlay.onclick = function(e) { if (e.target === this) closeAchievementCard(); };
  
  overlay.innerHTML = `
    <div class="card-inner" id="achievementCardInner">
      <div class="card-badge">🏆</div>
      <div class="card-score">${score}/${total}</div>
      <h3 style="margin:4px 0;font-size:1.3em">今日打卡完成！</h3>
      <div class="card-detail">正确率 ${pct}% · 第 ${levelNum} 关通关</div>
      <div class="card-detail" style="margin-top:4px">${today}</div>
      <div style="margin:10px 0">
        <span class="rank-badge ${rank.class}">${rank.icon} ${rank.name}段位</span>
      </div>
      <div class="card-detail">🔥 连续打卡 <strong>${student.streak}</strong> 天</div>
      <div class="card-detail">📚 已学 <strong>${student.totalWords}</strong> 个单词</div>
      <div class="card-teacher">👩‍🏫 指导老师：${escapeHtml(user.teacher)}</div>
      <div class="card-actions">
        <button class="btn btn-primary" onclick="captureAndShare()">📸 截图发给老师</button>
        <button class="btn btn-outline" onclick="closeAchievementCard()">返回主页</button>
      </div>
      <div class="screenshot-tip">💡 点击「截图发给老师」即可保存成就卡片并发送给 ${escapeHtml(user.teacher)} 老师</div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeAchievementCard() {
  const overlay = document.getElementById('achievementOverlay');
  if (overlay) overlay.remove();
  showStudentDashboard();
}

function captureAndShare() {
  const user = getCurrentUser();
  const cardInner = document.getElementById('achievementCardInner');
  if (!cardInner) return;
  
  showToast('正在生成成就卡片...', 'info');
  
  const overlay = document.getElementById('achievementOverlay');
  if (overlay) overlay.style.background = 'rgba(0,0,0,0)';
  
  const rank = getRank((loadData().students[user.teacher]?.[user.name]?.streak || 0));
  const student = loadData().students[user.teacher]?.[user.name] || {};
  const pct = Math.round(quizState.score / quizState.questions.length * 100);
  
  const canvas = document.createElement('canvas');
  canvas.width = 750;
  canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  
  const bg = ctx.createLinearGradient(0, 0, 0, 1000);
  bg.addColorStop(0, '#FFFFFF');
  bg.addColorStop(1, '#FFF8F0');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 750, 1000);
  
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#6C5CE7';
  ctx.beginPath(); ctx.arc(650, 100, 200, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FD79A8';
  ctx.beginPath(); ctx.arc(100, 900, 150, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  
  ctx.fillStyle = '#6C5CE7';
  ctx.font = 'bold 48px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🌟 单词大冒险', 375, 80);
  
  ctx.font = '120px serif';
  ctx.fillText('🏆', 375, 220);
  
  const scoreGrad = ctx.createLinearGradient(200, 270, 550, 270);
  scoreGrad.addColorStop(0, '#6C5CE7');
  scoreGrad.addColorStop(1, '#00CEC9');
  ctx.fillStyle = scoreGrad;
  ctx.font = 'bold 80px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText(quizState.score + '/' + quizState.questions.length, 375, 350);
  
  ctx.fillStyle = '#2D3436';
  ctx.font = 'bold 36px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('今日打卡完成！', 375, 420);
  
  ctx.fillStyle = '#636E72';
  ctx.font = '24px "PingFang SC", "Microsoft YaHei", sans-serif';
  const today = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  ctx.fillText('正确率 ' + pct + '% · 第 ' + (student.level||0) + ' 关通关', 375, 470);
  ctx.fillText(today, 375, 505);
  
  ctx.fillStyle = '#6C5CE7';
  ctx.font = 'bold 28px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText(rank.icon + ' ' + rank.name + '段位', 375, 560);
  
  ctx.fillStyle = '#636E72';
  ctx.font = '24px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('🔥 连续打卡 ' + (student.streak||0) + ' 天', 375, 610);
  ctx.fillText('📚 已学 ' + (student.totalWords||0) + ' 个单词', 375, 650);
  
  ctx.fillStyle = '#6C5CE7';
  ctx.font = 'bold 28px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('👩‍🏫 指导老师：' + user.teacher, 375, 720);
  
  ctx.strokeStyle = '#E0E0E0';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(150, 760); ctx.lineTo(600, 760); ctx.stroke();
  
  ctx.fillStyle = '#B2BEC3';
  ctx.font = '20px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('单词大冒险 · 中考核心词汇闯关', 375, 810);
  ctx.fillText('坚持就是胜利，每天进步一点点！', 375, 850);
  
  canvas.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    
    if (navigator.share && navigator.canShare) {
      const file = new File([blob], '单词打卡成就_' + user.name + '.png', { type: 'image/png' });
      const shareData = { title: '单词打卡成就', text: '🌟 我今天完成了单词打卡！正确率' + pct + '%！', files: [file] };
      if (navigator.canShare(shareData)) {
        navigator.share(shareData).catch(() => { downloadImage(url, user.name); });
      } else {
        downloadImage(url, user.name);
      }
    } else {
      downloadImage(url, user.name);
    }
    
    showToast('成就卡片已生成！请发送给 ' + user.teacher + ' 老师 📤', 'success');
  }, 'image/png');
  
  if (overlay) overlay.style.background = '';
}

function downloadImage(url, studentName) {
  const a = document.createElement('a');
  a.href = url;
  a.download = '单词打卡成就_' + studentName + '.png';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function spawnConfetti() {
  const emojis = ['🎉','🌟','✨','💪','🎊','🏆','⭐','💎'];
  for (let i=0;i<20;i++) { setTimeout(() => { const p=document.createElement('div'); p.className='confetti-piece'; p.textContent=emojis[Math.floor(Math.random()*emojis.length)]; p.style.left=Math.random()*100+'%'; p.style.top=(60+Math.random()*20)+'%'; p.style.animationDuration=(1+Math.random()*2)+'s'; document.body.appendChild(p); setTimeout(()=>p.remove(),3000); }, i*80); }
}

// ==================== TEACHER DASHBOARD ====================
let teacherClassFilter = 'all';
let teacherSearchQuery = '';

function showTeacherDashboard() {
  const user = getCurrentUser();
  if (!user || user.role !== 'teacher') { showLoginScreen(); return; }
  showScreen('teacherDashboard');
  renderTeacherDashboard();
}

function renderTeacherDashboard() {
  const user = getCurrentUser();
  const data = loadData();
  const students = data.students[user.name] || {};
  const sList = Object.entries(students);
  const classes = new Set(); sList.forEach(([n,s]) => { if (s.className) classes.add(s.className); });
  let filtered = sList;
  if (teacherClassFilter !== 'all') filtered = sList.filter(([n,s]) => s.className === teacherClassFilter);
  if (teacherSearchQuery) { const q = teacherSearchQuery.toLowerCase(); filtered = filtered.filter(([n,s]) => n.toLowerCase().includes(q)); }
  const total = sList.length;
  const activeToday = sList.filter(([n,s]) => s.lastStudyDate === new Date().toDateString()).length;
  const avgLevel = total>0 ? Math.round(sList.reduce((sum,[n,s])=>sum+(s.level||0),0)/total) : 0;
  const avgStreak = total>0 ? Math.round(sList.reduce((sum,[n,s])=>sum+(s.streak||0),0)/total) : 0;
  let classTags = `<span class="class-tag ${teacherClassFilter==='all'?'active':''}" onclick="filterByClass('all')">全部(${total})</span>`;
  classes.forEach(c => { const cnt = sList.filter(([n,s]) => s.className===c).length; classTags += `<span class="class-tag ${teacherClassFilter===c?'active':''}" onclick="filterByClass('${c.replace(/'/g,"\\'")}')">${c}(${cnt})</span>`; });
  let tableHtml = '';
  if (filtered.length === 0) {
    tableHtml = `<div class="empty-state"><div class="icon">📭</div><p>暂无学员数据</p></div>`;
  } else {
    tableHtml = `<div class="table-wrap"><table class="student-table"><thead><tr><th>姓名</th><th>班级</th><th>当前关卡</th><th>已学单词</th><th>打卡天数</th><th>最近打卡</th><th>段位</th><th>操作</th></tr></thead><tbody>${filtered.map(([name,s])=>{const r=getRank(s.streak||0);return`<tr><td><strong>${name}</strong></td><td>${s.className||'-'}</td><td>第${(s.level||0)+1}关</td><td>${s.totalWords||0}</td><td>${s.streak||0}天</td><td>${s.lastStudyDate||'未开始'}</td><td>${r.icon} ${r.name}</td><td><button class="btn btn-danger btn-xs" onclick="deleteStudent('${name.replace(/'/g,"\\'")}')" title="删除学员">🗑️</button></td></tr>`;}).join('')}</tbody></table></div>`;
  }
  document.getElementById('teacherDashboard').innerHTML = `<div class="card"><div class="card-title">📊 班级概览</div><div class="stats-row"><div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">学员总数</div></div><div class="stat-card"><div class="stat-value">${activeToday}</div><div class="stat-label">今日打卡</div></div><div class="stat-card"><div class="stat-value">${avgLevel}</div><div class="stat-label">平均关卡</div></div><div class="stat-card"><div class="stat-value">${avgStreak}天</div><div class="stat-label">平均打卡</div></div></div></div>
  <div class="card"><div class="card-title">👨‍🎓 学员管理</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <input type="text" class="search-input" id="studentSearch" placeholder="🔍 搜索学员姓名..." value="${teacherSearchQuery}" oninput="teacherSearchQuery=this.value;renderTeacherDashboard()" style="flex:1;min-width:150px">
      <button class="btn btn-accent btn-sm" onclick="showImportModal()">📥 批量导入</button>
      <button class="btn btn-primary btn-sm" onclick="showAddStudentModal()">➕ 添加学员</button>
      <button class="btn btn-success btn-sm" onclick="exportCSV()">📤 导出数据</button>
    </div>
    <div class="class-tags">${classTags}</div>
    ${tableHtml}
  </div>`;
}

function filterByClass(cls) { teacherClassFilter = cls; renderTeacherDashboard(); }

function showImportModal() {
  showModal('📥 导入学员', `
    <p style="font-size:0.85em;color:var(--text-light);margin-bottom:8px">每行一个学员姓名，或用逗号分隔<br>可选：姓名,班级（如：张三,1班）</p>
    <textarea id="importText" placeholder="张三,1班&#10;李四,2班&#10;王五,1班"></textarea>
    <p style="font-size:0.75em;color:var(--text-lighter);margin-top:8px">输入姓名即可，无需密码</p>
  `, `<button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="doImport()">确认导入</button>`);
}

function doImport() {
  const text = document.getElementById('importText').value.trim();
  if (!text) { showToast('请输入学员姓名', 'error'); return; }
  const user = getCurrentUser();
  const data = loadData();
  if (!data.students[user.name]) data.students[user.name] = {};
  let count = 0;
  const lines = text.split(/[\n,，]+/);
  lines.forEach(line => {
    line = line.trim();
    if (!line) return;
    const parts = line.split(/[,，]/);
    const name = parts[0].trim();
    const cls = parts[1] ? parts[1].trim() : '';
    if (!name) return;
    if (!data.students[user.name][name]) {
      data.students[user.name][name] = { level: 0, streak: 0, lastStudyDate: null, lastStreakDate: null, totalWords: 0, className: cls, createdAt: new Date().toISOString() };
      count++;
    }
  });
  saveData(data);
  closeModal();
  renderTeacherDashboard();
  showToast(`成功导入 ${count} 名新学员！`, 'success');
}

// ==================== SINGLE STUDENT ADD ====================
function showAddStudentModal() {
  showModal('➕ 添加学员', `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="display:block;font-weight:600;margin-bottom:4px;font-size:0.9em">学员姓名 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="addStudentName" placeholder="输入学员姓名" style="width:100%;padding:10px 14px;border:2px solid #E0E0E0;border-radius:var(--radius-sm);font-size:0.95em">
      </div>
      <div>
        <label style="display:block;font-weight:600;margin-bottom:4px;font-size:0.9em">班级（可选）</label>
        <input type="text" id="addStudentClass" placeholder="如：1班、A班" style="width:100%;padding:10px 14px;border:2px solid #E0E0E0;border-radius:var(--radius-sm);font-size:0.95em">
      </div>
    </div>
    <p style="font-size:0.75em;color:var(--text-lighter);margin-top:8px">添加后学员即可在登录界面选择老师并输入姓名进入系统</p>
  `, `<button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="doAddStudent()">确认添加</button>`);
  setTimeout(() => { const inp = document.getElementById('addStudentName'); if (inp) inp.focus(); }, 150);
}

function doAddStudent() {
  const name = document.getElementById('addStudentName').value.trim();
  const cls = document.getElementById('addStudentClass').value.trim();
  if (!name) { showToast('请输入学员姓名', 'error'); return; }
  const user = getCurrentUser();
  const data = loadData();
  if (!data.students[user.name]) data.students[user.name] = {};
  if (data.students[user.name][name]) {
    showToast('学员「' + name + '」已存在，无需重复添加', 'error');
    return;
  }
  data.students[user.name][name] = {
    level: 0, streak: 0, lastStudyDate: null, lastStreakDate: null,
    totalWords: 0, className: cls, createdAt: new Date().toISOString()
  };
  saveData(data);
  closeModal();
  renderTeacherDashboard();
  showToast('学员「' + name + '」添加成功！✅', 'success');
}

// ==================== SINGLE STUDENT DELETE ====================
function deleteStudent(name) {
  const user = getCurrentUser();
  const data = loadData();
  const student = data.students[user.name]?.[name];
  if (!student) { showToast('学员不存在', 'error'); return; }
  const learned = student.totalWords || 0;
  const streak = student.streak || 0;
  showModal('⚠️ 确认删除', `
    <p style="margin-bottom:12px">确定要删除学员 <strong style="color:var(--danger)">${escapeHtml(name)}</strong> 吗？</p>
    <div style="background:#FFF0ED;padding:12px;border-radius:var(--radius-sm);margin-bottom:12px">
      <p style="font-size:0.85em;color:var(--danger);font-weight:600">⚠️ 该学员的学习数据将被永久删除：</p>
      <ul style="font-size:0.8em;color:var(--text-light);margin:8px 0 0 16px">
        <li>已学单词：${learned} 个</li>
        <li>打卡天数：${streak} 天</li>
        <li>班级：${escapeHtml(student.className || '无')}</li>
      </ul>
    </div>
    <p style="font-size:0.8em;color:var(--text-lighter)">此操作不可撤销。删除后其他学员数据不受影响。</p>
  `, `<button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-danger btn-sm" onclick="confirmDeleteStudent('${name.replace(/'/g,"\\'")}')">确认删除</button>`);
}

function confirmDeleteStudent(name) {
  const user = getCurrentUser();
  const data = loadData();
  if (data.students[user.name] && data.students[user.name][name]) {
    delete data.students[user.name][name];
    saveData(data);
    closeModal();
    renderTeacherDashboard();
    showToast('学员「' + name + '」已删除', 'info');
  }
}

function exportCSV() {
  const user = getCurrentUser();
  const data = loadData();
  const students = data.students[user.name] || {};
  const sList = Object.entries(students);
  let filtered = sList;
  if (teacherClassFilter !== 'all') filtered = sList.filter(([n,s]) => s.className === teacherClassFilter);
  if (teacherSearchQuery) { const q = teacherSearchQuery.toLowerCase(); filtered = filtered.filter(([n,s]) => n.toLowerCase().includes(q)); }
  let csv = '\uFEFF姓名,班级,当前关卡,已学单词数,打卡天数,最近打卡日期,段位\n';
  filtered.forEach(([name, s]) => {
    const rank = getRank(s.streak || 0);
    csv += `${name},${s.className||''},第${(s.level||0)+1}关,${s.totalWords||0},${s.streak||0}天,${s.lastStudyDate||'未开始'},${rank.name}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `单词打卡数据_${user.name}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('导出成功！', 'success');
}

// ==================== INIT ====================
function init() {
  // Speech compatibility check
  if (!window.speechSynthesis) {
    console.warn('SpeechSynthesis not supported in this browser');
  } else {
    // Pre-warm speech synthesis
    const s = speechSynthesis;
    s.getVoices();
    s.onvoiceschanged = () => { s.getVoices(); };
    // Some browsers need a dummy utterance to 'wake up' speech
    document.addEventListener('click', () => {
      const dummy = new SpeechSynthesisUtterance('');
      dummy.volume = 0;
      dummy.rate = 1.5;
      try { s.speak(dummy); } catch(e) {}
    }, { once: true });
  }
  
  const user = getCurrentUser();
  updateHeader();
  if (user) {
    if (user.role === 'teacher') showTeacherDashboard();
    else showStudentDashboard();
  } else {
    showLoginScreen();
  }
}

init();
</script>
</body>
</html>
