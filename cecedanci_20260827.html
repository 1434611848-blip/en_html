<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你的单词</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: "微软雅黑","PingFang SC","Microsoft YaHei",sans-serif;
    background: linear-gradient(160deg,#fdeff9 0%,#e3f2fd 100%); color:#4a4a4a;
    min-height:100vh; padding:16px;
  }
  h1 { text-align:center; font-size:24px; color:#ff6b9d; margin:8px 0 4px; }
  .sub { text-align:center; font-size:13px; color:#888; margin-bottom:14px; }
  .screen { max-width:600px; margin:0 auto; }
  .hidden { display:none !important; }

  .card-box {
    background:#fff; border-radius:18px; padding:22px; margin-bottom:14px;
    box-shadow:0 6px 18px rgba(255,107,157,.14); border:2px solid #ffd6e7;
  }
  label { display:block; font-weight:bold; color:#ff6b9d; font-size:15px; margin:14px 0 8px; }
  input[type=text]{
    width:100%; padding:14px; font-size:18px; border:3px solid #ffd6e7; border-radius:14px; outline:none; text-align:center;
  }
  input[type=text]:focus{ border-color:#ff6b9d; }
  .opts { display:flex; flex-wrap:wrap; gap:10px; }
  .opt {
    flex:1 1 calc(33% - 10px); min-width:90px; padding:14px 8px; border-radius:14px; background:#fff7fb;
    border:2px solid #ffd6e7; color:#ff6b9d; font-weight:bold; font-size:15px; text-align:center; cursor:pointer; transition:.15s;
  }
  .opt.sel { background:#ff6b9d; color:#fff; border-color:#ff6b9d; transform:scale(1.03); }
  .btn {
    display:inline-block; background:#ff6b9d; color:#fff; border:none; border-radius:22px;
    padding:13px 28px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:16px;
  }
  .btn:active{ transform:scale(.96); }
  .btn.ghost{ background:#fff; color:#ff6b9d; border:2px solid #ffd6e7; }
  .btn.block{ width:100%; }

  /* 闪卡 */
  .progress{ font-size:13px; color:#888; text-align:center; margin-bottom:10px; }
  .card{ width:100%; height:280px; perspective:1000px; cursor:pointer; margin-bottom:14px; }
  .card-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; width:100%; height:100%; backface-visibility:hidden; border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px;
  }
  .card-front{ background:linear-gradient(135deg,#fff1f7,#ffe0ec); border:3px solid #ffb3d1; }
  .card-back{ background:linear-gradient(135deg,#e0f7ff,#d3ecff); border:3px solid #9fd8ff; transform:rotateY(180deg); }
  .word-en{ font-size:44px; font-weight:bold; color:#ff4f8b; }
  .word-zh{ font-size:38px; font-weight:bold; color:#2b8fd6; }
  .tap-hint{ font-size:13px; color:#bbb; margin-top:16px; }
  .speaker{ font-size:30px; margin-top:8px; cursor:pointer; }
  .flash-btns{ display:flex; gap:12px; justify-content:center; }
  .flash-btns .btn{ margin-top:0; }
  .btn.no{ background:#ff5252; } .btn.yes{ background:#4caf50; }

  /* 闪卡三选一 */
  .flash-q{ font-size:14px; color:#2b8fd6; margin-bottom:10px; }
  .flash-opts{ display:flex; flex-direction:column; gap:9px; width:92%; }
  .flash-opt{ padding:11px 10px; border-radius:12px; background:#fff7fb; border:2px solid #ffd6e7; color:#ff6b9d; font-weight:bold; font-size:16px; cursor:pointer; transition:.15s; }
  .flash-opt:active{ transform:scale(.97); }
  .flash-opt.sel-ok{ background:#4caf50; color:#fff; border-color:#4caf50; }
  .flash-opt.sel-no{ background:#ff5252; color:#fff; border-color:#ff5252; }
  .flash-feedback{ font-size:15px; font-weight:bold; margin-top:10px; min-height:18px; }

  /* 气球 */
  .game-bar{ display:flex; justify-content:space-between; background:#fff; border-radius:14px; padding:10px 16px; margin-bottom:10px; font-weight:bold; box-shadow:0 4px 14px rgba(255,107,157,.12); }
  .game-bar .score{ color:#ff6b9d; } .game-bar .miss{ color:#ff5252; }
  .xx-cols{ display:flex; gap:14px; margin-top:8px; }
  .xx-col{ flex:1; display:flex; flex-direction:column; gap:10px; }
  .xx-col-title{ text-align:center; font-size:14px; color:#ff6b9d; font-weight:bold; margin-bottom:2px; }
  .xx-card{ padding:14px 8px; border-radius:14px; background:#fff7fb; border:2px solid #ffd6e7; text-align:center; font-weight:bold; font-size:16px; color:#ff6b9d; cursor:pointer; box-shadow:0 4px 12px rgba(255,107,157,.12); transition:.15s; min-height:48px; display:flex; align-items:center; justify-content:center; user-select:none; }
  .xx-card:active{ transform:scale(.97); }
  .xx-card.sel{ border-color:#2b8fd6; background:#eaf4ff; color:#2b8fd6; }
  .xx-card.bad{ border-color:#ff5252; background:#ffebee; color:#ff5252; animation:shake .3s; }
  .xx-card.gone{ visibility:hidden; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  select.ver-sel{ width:100%; padding:14px; font-size:17px; border:3px solid #ffd6e7; border-radius:14px; outline:none; background:#fff; color:#4a4a4a; text-align:center; text-align-last:center; }
  select.ver-sel:focus{ border-color:#ff6b9d; }
  select.ver-sel option{ text-align:center; }

  /* 表扬榜 */
  .board{
    background:linear-gradient(135deg,#fff0f7,#ffe3f1); border:4px solid #ffb3d1; border-radius:22px;
    padding:24px; text-align:center; box-shadow:0 10px 28px rgba(255,107,157,.25); position:relative; overflow:hidden;
  }
  .board .deco{ font-size:30px; letter-spacing:6px; }
  .board .title{ font-size:30px; font-weight:bold; color:#ff4f8b; margin:6px 0; }
  .board .name{ font-size:22px; color:#2b8fd6; font-weight:bold; margin:10px 0; }
  .board .praise{ font-size:17px; line-height:1.7; color:#5a5a5a; margin:14px 0; }
  .board .slogan{ font-size:16px; color:#ff6b9d; font-weight:bold; }
  .board .stats{ display:flex; justify-content:space-around; margin:16px 0; }
  .board .stats div b{ display:block; font-size:28px; color:#ff6b9d; }
  .board .stats div span{ font-size:13px; color:#888; }
  .board .meta{ font-size:13px; color:#999; margin-top:8px; }

  /* 错题本 */
  .wrong-box{ background:#fff; border-radius:16px; padding:18px; margin-top:14px; border:2px solid #ffd6e7; }
  .wrong-box h3{ color:#ff4f8b; margin:0 0 10px; font-size:16px; }
  .wrong-item{ display:inline-block; background:#ffe0ec; color:#ff4f8b; border-radius:12px; padding:7px 13px; margin:4px; font-size:14px; }
  .wrong-empty{ color:#4caf50; font-weight:bold; text-align:center; }

  .stage-tip{ text-align:center; color:#888; padding:30px 0; }
</style>
<script src="supabase.js"></script>
</head>
<body>
  <h1>📝 测测你的单词</h1>
  <div class="sub">先填信息 → 选一个游戏 → 闯关检测 → 表扬榜 + 错题本</div>

  <!-- ===== 开始页 ===== -->
  <div class="screen" id="screen-start">
    <div class="card-box">
      <label>🌟 小侦探名字</label>
      <input type="text" id="stuName" placeholder="请输入你的名字" autocomplete="off">

      <label>👩‍🏫 选择老师</label>
      <div class="opts" id="teacherOpts">
        <div class="opt" data-teacher="亚飞老师">亚飞老师</div>
        <div class="opt" data-teacher="亚楠老师">亚楠老师</div>
      </div>

      <label>📚 选择教材版本</label>
      <select class="ver-sel" id="versionSel">
        <option value="">-- 请选择教材版本 --</option>
      </select>

      <label>🎮 选择游戏</label>
      <div class="opts" id="gameOpts">
        <div class="opt" data-game="flash">🃏 闪卡翻翻卡<br><span style="font-size:12px;font-weight:normal">汉译英·三选一</span></div>
        <div class="opt" data-game="xiaoxiaole">🧩 单词消消乐<br><span style="font-size:12px;font-weight:normal">英汉配对·消除</span></div>
      </div>

      <button class="btn block" id="startBtn">开始检测 🚀</button>
    </div>
  </div>

  <!-- ===== 闪卡页 ===== -->
  <div class="screen hidden" id="screen-flash">
    <div class="card-box">
      <div class="progress" id="flashProgress"></div>
      <div class="card" id="card">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="word-en" id="cardEn"></div>
            <div class="speaker" id="speaker" title="听发音">🔊</div>
            <div class="tap-hint">点一下翻出英文 👆</div>
          </div>
          <div class="card-face card-back">
            <div class="flash-q">请选出正确英文 👇</div>
            <div class="flash-opts" id="flashOpts"></div>
            <div class="flash-feedback" id="flashFeedback"></div>
          </div>
        </div>
      </div>
      <div id="flashStart"><button class="btn" id="flashStartBtn">开始翻卡（汉译英·三选一）</button></div>
      <div id="flashResult" class="hidden"></div>
    </div>
  </div>

  <!-- ===== 消消乐页 ===== -->
  <div class="screen hidden" id="screen-xiaoxiaole">
    <div class="card-box">
      <div class="game-bar">
        <span>进度：<span id="xxProgress">0/30</span></span>
        <span class="miss">配错过：<span id="xxMiss">0</span></span>
      </div>
      <div id="xxArea" class="hidden">
        <div class="xx-cols">
          <div class="xx-col"><div class="xx-col-title">🔤 English</div><div id="xxEn"></div></div>
          <div class="xx-col"><div class="xx-col-title">🀄 中文</div><div id="xxCn"></div></div>
        </div>
      </div>
      <div id="xxStart"><div class="stage-tip">🧩 单词消消乐（英汉配对消除）<br><br><button class="btn" id="xxStartBtn">开始消消乐</button></div></div>
      <div id="xxResult" class="hidden"></div>
    </div>
  </div>

  <!-- ===== 表扬榜 + 错题本 ===== -->
  <div class="screen hidden" id="screen-board">
    <div class="board" id="board"></div>
    <div class="wrong-box" id="wrongBox"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn" id="retryWrong">🔁 用错题重练</button>
      <button class="btn ghost" id="backHome">返回首页</button>
    </div>
  </div>

const $ = id => document.getElementById(id);
const qsa = sel => document.querySelectorAll(sel);
function showScreen(id){ qsa('.screen').forEach(s=>s.classList.add('hidden')); $(id).classList.remove('hidden'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function speak(t){
  t=(t||'').trim(); if(!t) return;
  if(!('speechSynthesis' in window)) return;
  try{
    if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    if(speechSynthesis.resume) try{ speechSynthesis.resume(); }catch(e){}
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const vs=speechSynthesis.getVoices()||[];
    const en=vs.find(function(v){return /en[-_]?US/i.test(v.lang);}) || vs.find(function(v){return /^en/i.test(v.lang);});
    if(en) u.voice=en;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ===================== 闪卡（汉译英） =====================
function startFlash(){
  showScreen('screen-flash');
  flashIdx=0; flashWrong=[]; flashFlipped=false;
  $('flashResult').classList.add('hidden');
  $('flashStart').classList.remove('hidden');
  $('card').classList.remove('flipped');
  $('flashProgress').textContent = `共 ${flashList.length} 个单词，点击卡片翻过来`;
  $('cardEn').textContent='';
}
$('flashStartBtn').addEventListener('click', ()=>{ $('flashStart').classList.add('hidden'); nextFlash(); });
function nextFlash(){
  if(flashIdx>=flashList.length){ finishFlash(); return; }
  const w=flashList[flashIdx];
  curFlashWord=w;
  $('cardEn').textContent=w.zh;
  $('flashOpts').innerHTML='';
  $('flashFeedback').textContent='';
  flashFlipped=false;
  $('card').classList.remove('flipped');
  $('flashProgress').textContent = `第 ${flashIdx+1} / ${flashList.length} 个`;
  $('card').onclick = ()=>{
    if(flashFlipped) return;
    flashFlipped=true;
    $('card').classList.add('flipped');
    renderFlashOptions(w);
  };
}
function renderFlashOptions(w){
  const pool = WORD_BANK[curVersion].filter(x=>x.en && x.en!==w.en);
  const distract = shuffle(pool).slice(0,2).map(x=>x.en);
  const opts = shuffle([w.en, ...distract]);
  $('flashOpts').innerHTML = opts.map(o=>`<div class="flash-opt" data-en="${o}">${o}</div>`).join('');
  $('flashOpts').querySelectorAll('.flash-opt').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); chooseFlash(el, w); });
  });
}
function chooseFlash(el, w){
  if($('flashOpts').dataset.done) return;
  $('flashOpts').dataset.done='1';
  const correct = (el.dataset.en === w.en);
  $('flashOpts').querySelectorAll('.flash-opt').forEach(o=>{
    o.style.pointerEvents='none';
    if(o.dataset.en===w.en) o.classList.add('sel-ok');
    else if(o===el) o.classList.add('sel-no');
  });
  if(correct){
    $('flashFeedback').textContent='✅ 太棒了，答对了！';
  } else {
    $('flashFeedback').textContent='❌ 正确是：'+w.en;
    flashWrong.push(w);
  }
  setTimeout(()=>{ $('flashOpts').removeAttribute('data-done'); flashIdx++; nextFlash(); }, 1100);
}
function finishFlash(){
  flashPlayed=true;
  $('flashResult').classList.remove('hidden');
  const ok = flashList.length - flashWrong.length;
  let h=`<div class="board" style="border-width:3px"><div class="deco">🃏</div><div class="title">闪卡挑战完成！</div>`;
  h+=`<div class="praise">答对 <b>${ok}</b> / ${flashList.length} 个${ flashWrong.length? '，'+flashWrong.length+' 个待攻克' : '，全部拿下了！🌟' }</div>`;
  if(flashWrong.length){
    h+=`<div style="margin:10px 0">`+flashWrong.map(w=>`<span class="wrong-item">${w.en} · ${w.zh}</span>`).join('')+`</div>`;
  }
  h+=`<div style="text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">`;
  h+=`<button class="btn" id="toBoardFromFlash">查看表扬榜 🏆</button>`;
  h+=`<button class="btn ghost" id="playXX">换玩消消乐 🧩</button>`;
  h+=`</div></div>`;
  $('flashResult').innerHTML=h;
  $('toBoardFromFlash').addEventListener('click', ()=>{ totalWrong = flashWrong.slice(); showBoard(); });
  $('playXX').addEventListener('click', startXiaoxiaole);
}

// ===================== 消消乐（英汉配对消除） =====================
let xxSel=null, XX_BATCH=5;
function startXiaoxiaole(){
  showScreen('screen-xiaoxiaole');
  $('xxResult').classList.add('hidden');
  score=0; xxWrong=[]; xxIdx=0; xxSel=null;
  if(!retryMode) xxList = shuffle(WORD_BANK[curVersion]).slice(0,30); // 重练模式保留错词
  $('xxStart').classList.remove('hidden');
  $('xxArea').classList.add('hidden');
}
$('xxStartBtn').addEventListener('click', ()=>{ $('xxStart').classList.add('hidden'); $('xxArea').classList.remove('hidden'); nextXXBatch(); });
function nextXXBatch(){
  if(xxIdx>=xxList.length){ finishXX(); return; }
  const batch = xxList.slice(xxIdx, xxIdx+XX_BATCH);
  xxIdx += batch.length;
  xxSel=null;
  const enWrap=$('xxEn'), cnWrap=$('xxCn');
  enWrap.innerHTML=''; cnWrap.innerHTML='';
  shuffle(batch).forEach(w=>{
    const c=document.createElement('div'); c.className='xx-card'; c.textContent=w.en;
    c.addEventListener('click',()=>selectXX(c,'en',w));
    enWrap.appendChild(c);
  });
  shuffle(batch).forEach(w=>{
    const c=document.createElement('div'); c.className='xx-card'; c.textContent=w.zh;
    c.addEventListener('click',()=>selectXX(c,'cn',w));
    cnWrap.appendChild(c);
  });
  updateXXBar();
}
function selectXX(el, type, w){
  if(el.classList.contains('gone')) return;
  if(xxSel && xxSel.el===el){ el.classList.remove('sel'); xxSel=null; return; }
  if(xxSel){
    if(xxSel.type!==type && xxSel.w.en===w.en){
      el.classList.add('gone'); xxSel.el.classList.add('gone');
      xxSel=null; updateXXBar(); checkXXBatchDone();
    } else {
      const bad=[xxSel.el, el];
      bad.forEach(x=>x.classList.add('bad'));
      if(xxSel.type==='en') addXXWrong(xxSel.w); else addXXWrong(w);
      setTimeout(()=>bad.forEach(x=>x.classList.remove('bad')),350);
      xxSel.el.classList.remove('sel'); xxSel=null;
    }
  } else {
    xxSel={el, type, w}; el.classList.add('sel');
  }
}
function addXXWrong(w){ if(!xxWrong.some(x=>x.en===w.en)) xxWrong.push(w); updateXXBar(); }
function checkXXBatchDone(){
  const enDone=[...$('xxEn').children].every(c=>c.classList.contains('gone'));
  const cnDone=[...$('xxCn').children].every(c=>c.classList.contains('gone'));
  if(enDone && cnDone){ setTimeout(nextXXBatch, 320); }
}
function updateXXBar(){ $('xxProgress').textContent=Math.min(xxIdx,xxList.length)+'/'+xxList.length; $('xxMiss').textContent=xxWrong.length; }
function finishXX(){
  totalWrong = mergeWrong(flashWrong, xxWrong);
  const correct = xxList.length - xxWrong.length;
  score = correct;
  let h=`<div class="board" style="border-width:3px"><div class="deco">🧩</div><div class="title">消消乐完成！</div>`;
  h+=`<div class="praise">配对成功 <b>${correct}</b> / ${xxList.length} 个${ xxWrong.length? '，'+xxWrong.length+' 个配错过' : '，全部配对成功！🌟' }</div>`;
  if(xxWrong.length){ h+=`<div style="margin:10px 0">`+xxWrong.map(w=>`<span class="wrong-item">${w.en} · ${w.zh}</span>`).join('')+`</div>`; }
  h+=`<div style="text-align:center;margin-top:14px"><button class="btn" id="toBoard">查看表扬榜 🏆</button></div></div>`;
  $('xxResult').innerHTML=h;
  $('xxResult').classList.remove('hidden');
  xxPlayed=true;
  $('toBoard').addEventListener('click', showBoard);
}

// ===================== 错题合并 =====================
function mergeWrong(a,b){
  const map={};
  a.concat(b).forEach(w=>{ map[w.en]=w; });
  return Object.values(map);
}

// ===================== 成绩存档（localStorage） =====================
const REC_KEY='wordcheck_records';
function getRecords(){ try{ return JSON.parse(localStorage.getItem(REC_KEY)||'[]'); }catch(e){ return []; } }
// 本地兜底：仅当云端提交失败时保留一份，避免丢孩子成绩（不进榜单）
// 按 姓名|老师|版本 去重，只留最高分，避免本地堆积重复
function fallbackLocal(rec){
  const arr=getRecords();
  const key=(rec.name||'')+'|'+(rec.teacher||'')+'|'+(rec.version||'');
  const idx=arr.findIndex(r=>key===((r.name||'')+'|'+(r.teacher||'')+'|'+(r.version||'')));
  const score=(typeof rec.score==='number')?rec.score:0;
  if(idx>=0){
    const old=(typeof arr[idx].score==='number')?arr[idx].score:0;
    if(score>old){ arr[idx]=Object.assign({date:Date.now()},rec); }
  } else {
    arr.push(Object.assign({date:Date.now()},rec));
  }
  try{ localStorage.setItem(REC_KEY, JSON.stringify(arr)); }catch(e){}
}
// 成绩云端存档（Supabase），失败回退本地
function saveRecord(acc, correct, total, sc){
  const rec={
    name: curName, teacher: curTeacher, version: curVersion,
    game: (flashPlayed&&xxPlayed)?'两项都玩':(flashPlayed?'闪卡':'消消乐'),
    total, correct, score: (xxPlayed?sc:0),
    detail: (typeof totalWrong!=='undefined') ? totalWrong.map(w=>({en:w.en,zh:w.zh})) : [],
    submittedAt: new Date().toISOString()
  };
  if(window.CloudBox){
    CloudBox.uploadWordScore(rec).catch(function(err){
      console.error('云端保存失败，回退本地兜底：', err);
      fallbackLocal(rec);
    });
  } else {
    fallbackLocal(rec);
  }
}

// 启动补传：把本地兜底（旧版缓存/断网时滞留的成绩）自动上传云端，避免历史数据丢失
(function syncFallbackRecords(){
  try{
    const arr=getRecords();
    if(!arr.length || !window.CloudBox) return;
    (async function(){
      for(const r of arr){
        const sub = r.submittedAt || (r.date ? new Date(r.date).toISOString() : new Date().toISOString());
        try{ await CloudBox.uploadWordScore(Object.assign({}, r, {submittedAt: sub})); }
        catch(e){ return; } // 任意一条失败则保留剩余本地记录，下次再试
      }
      localStorage.removeItem(REC_KEY);
    })();
  }catch(e){}
})();

function showBoard(){
  showScreen('screen-board');
  const fTotal = flashPlayed ? flashList.length : 0;
  const fCorrect = flashPlayed ? (flashList.length - flashWrong.length) : 0;
  const bTotal = xxPlayed ? xxList.length : 0;
  const bCorrect = xxPlayed ? (xxList.length - xxWrong.length) : 0;
  const totalQ = fTotal + bTotal;
  const correct = fCorrect + bCorrect;
  const accuracy = totalQ ? Math.round(correct/totalQ*100) : 0;
  let emoji, tier, title, praise, slogan;
  if(accuracy>=90){ emoji='🥇'; tier='金牌小侦探'; title='太棒了！'; praise='你的单词又稳又准，全部拿下了，你就是最亮的那颗星！继续保持，老师为你骄傲～'; slogan='词汇小达人，闪耀每一课！'; }
  else if(accuracy>=70){ emoji='🥈'; tier='银牌小侦探'; title='很不错！'; praise='大部分单词都拿下了！把错题本里的小怪兽一个个打败，下次你就是满分王！'; slogan='错题变垫脚石，下次冲金牌！'; }
  else { emoji='🌱'; tier='潜力小侦探'; title='继续加油！'; praise='每个高手都是从不会开始的，今天你已经勇敢迈出第一步啦。多练几遍错题本，你一定可以的，老师相信你！'; slogan='每天进步一点点，未来闪闪发光！'; }
  const stars='⭐'.repeat(Math.max(1,Math.round(accuracy/20)));
  let h=`<div class="deco">${stars}</div>`;
  h+=`<div class="title">${emoji} ${tier}</div>`;
  h+=`<div class="name">${curName} 小朋友</div>`;
  h+=`<div class="praise">${title}<br>${praise}</div>`;
  h+=`<div class="stats"><div><b>${accuracy}%</b><span>正确率</span></div><div><b>${correct}</b><span>答对</span></div><div><b>${totalWrong.length}</b><span>待攻克</span></div></div>`;
  h+=`<div class="slogan">${slogan}</div>`;
  h+=`<div class="meta">指导老师：${curTeacher} ｜ 教材版本：${curVersion}</div>`;
  $('board').innerHTML=h;
  if(totalWrong.length){
    $('wrongBox').innerHTML = `<h3>📕 错题本（点「用错题重练」闪卡+消消乐一起练）</h3>` + totalWrong.map(w=>`<span class="wrong-item">${w.en} · ${w.zh}</span>`).join('');
  } else {
    $('wrongBox').innerHTML = `<div class="wrong-empty">🎉 没有错题，全部掌握！</div>`;
  }
  saveRecord(accuracy, correct, totalQ, score);
}
$('retryWrong').addEventListener('click', ()=>{
  if(!totalWrong.length){ alert('没有错题啦，直接返回首页吧～'); return; }
  retryMode=true;
  flashPlayed=false; xxPlayed=false;
  flashList = shuffle(totalWrong.slice());
  xxList = shuffle(totalWrong.slice());
  flashWrong=[]; xxWrong=[];
  startFlash();
});
$('backHome').addEventListener('click', ()=>{
  showScreen('screen-start');
  $('stuName').value='';
  qsa('#teacherOpts .opt').forEach(x=>x.classList.remove('sel'));
  curTeacher=''; $('versionSel').value='';
  $('flashResult').classList.add('hidden');
  $('xxResult').classList.add('hidden');
});

// ===================== 启动 =====================
initStart();
</script>
</body>
</html>
