<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词射击大作战 Word Shooting</title>
<style>
:root {
  --bg-deep: #020010;
  --bg-card: rgba(10,15,40,0.75);
  --border-card: rgba(100,140,255,0.2);
  --accent: #00e5ff;
  --accent2: #ff4081;
  --gold: #ffd740;
  --danger: #ff1744;
  --success: #69f0ae;
  --text: #e0e8ff;
  --text-dim: #7e8db0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
  background: radial-gradient(ellipse at center, #0a0a2e 0%, #020010 70%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stars {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 0;
}
.container {
  position: relative; z-index: 1;
  width: 100%; max-width: 560px;
  padding: 20px;
}
.card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-card);
  border-radius: 20px;
  padding: 36px 28px;
  display: none;
}
.card.active { display: block; }

h1 { font-size: 28px; text-align: center; margin-bottom: 6px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
h2 { font-size: 16px; text-align: center; color: var(--text-dim); font-weight: 400; margin-bottom: 28px; }
h3 { font-size: 20px; text-align: center; margin-bottom: 20px; color: var(--accent); }

.btn {
  display: block; width: 100%; max-width: 300px;
  margin: 12px auto; padding: 14px 28px;
  border: none; border-radius: 12px;
  font-size: 17px; font-weight: 600; cursor: pointer;
  font-family: inherit;
  transition: transform 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) { .btn:hover { transform: translateY(-2px); } }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, #0077ff, #00e5ff);
  color: #000; box-shadow: 0 4px 20px rgba(0,229,255,0.4);
}
.btn-primary:hover { box-shadow: 0 6px 28px rgba(0,229,255,0.6); }
.btn-fire {
  background: linear-gradient(135deg, var(--accent2), #ff6e40);
  color: #fff; box-shadow: 0 4px 20px rgba(255,64,129,0.5);
  font-size: 20px; letter-spacing: 2px;
}
.btn-fire:hover { box-shadow: 0 6px 30px rgba(255,64,129,0.7); }
.btn-outline {
  background: transparent; border: 2px solid var(--border-card);
  color: var(--text);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-small { max-width: 200px; padding: 10px 20px; font-size: 15px; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }

input[type="text"], select {
  display: block; width: 100%; max-width: 340px;
  margin: 8px auto 16px; padding: 12px 16px;
  border-radius: 10px; border: 1px solid var(--border-card);
  background: rgba(10,20,50,0.6); color: var(--text);
  font-size: 16px; font-family: inherit; outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--accent); }
select { appearance: none; -webkit-appearance: none; cursor: pointer; }
label { display: block; max-width: 340px; margin: 0 auto; font-size: 14px; color: var(--text-dim); }

.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; background: rgba(0,229,255,0.06);
  border-radius: 12px; margin-bottom: 16px; font-size: 14px;
  flex-wrap: wrap; gap: 8px;
}
.status-item { display: flex; align-items: center; gap: 4px; }
.status-item.warning { color: var(--danger); }

/* Progress bar */
.progress-bar {
  height: 4px; background: rgba(255,255,255,0.08);
  border-radius: 2px; margin-bottom: 20px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px; transition: width 0.4s;
}

/* Word fly area */
.word-display-area {
  position: relative; height: 100px; overflow: hidden;
  margin-bottom: 20px; display: flex; align-items: center; justify-content: center;
}
.word-fly {
  font-size: 36px; font-weight: 700; color: var(--accent);
  text-shadow: 0 0 20px rgba(0,229,255,0.6), 0 0 40px rgba(0,229,255,0.3);
  animation: flyIn 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
}
.word-fly.fast { animation: flyInFast 0.3s cubic-bezier(0.25,0.46,0.45,0.94); }
@keyframes flyIn {
  0% { transform: translateY(-80px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes flyInFast {
  0% { transform: translateY(-80px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

/* Input area */
.shoot-input-wrap {
  display: flex; gap: 12px; align-items: center;
  max-width: 400px; margin: 0 auto;
}
.shoot-input-wrap input {
  flex: 1; margin: 0; max-width: none;
  font-size: 18px; font-family: 'SF Mono','Menlo',monospace;
  text-align: center;
}

/* Timer */
.timer-bar {
  height: 8px; background: rgba(255,255,255,0.1);
  border-radius: 4px; margin-bottom: 12px; overflow: hidden;
}
.timer-fill {
  height: 100%; background: linear-gradient(90deg, var(--success), var(--gold), var(--danger));
  border-radius: 4px; transition: width 0.1s linear;
}
.timer-text {
  text-align: center; font-size: 28px; font-weight: 700;
  font-variant-numeric: tabular-nums; font-family: 'SF Mono','Menlo',monospace;
  margin-bottom: 12px; transition: color 0.3s;
}
.timer-text.urgent { color: var(--danger); animation: pulse 0.5s infinite; }
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Explosion effect */
.explosion {
  position: absolute; pointer-events: none; z-index: 50;
}
.particle-burst {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  animation: burst 0.6s ease-out forwards;
}
@keyframes burst {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
}

/* Hit flash */
.hit-flash {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 200;
  animation: flash 0.3s ease-out forwards;
}
@keyframes flash {
  0% { background: rgba(0,229,255,0.15); }
  100% { background: transparent; }
}

.miss-flash {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 200;
  animation: missFlash 0.3s ease-out forwards;
}
@keyframes missFlash {
  0% { background: rgba(255,23,68,0.15); }
  100% { background: transparent; }
}

/* Result */
.feedback-text {
  text-align: center; font-size: 20px; font-weight: 700;
  margin-top: 10px; min-height: 32px;
}
.feedback-text.correct { color: var(--success); }
.feedback-text.wrong { color: var(--danger); }

/* Leaderboard */
.leaderboard { width: 100%; border-collapse: collapse; margin: 16px 0; }
.leaderboard th, .leaderboard td {
  padding: 8px 6px; text-align: center; font-size: 13px;
  border-bottom: 1px solid var(--border-card);
}
.leaderboard th { color: var(--gold); font-weight: 600; }
.leaderboard .highlight td { background: rgba(0,229,255,0.12); color: #fff; }

.sound-btn {
  position: fixed; top: 16px; right: 16px; z-index: 50;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border-card); background: var(--bg-card);
  color: var(--text); font-size: 18px; cursor: pointer;
  backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
}
.sound-btn:hover { border-color: var(--accent); }

#page-result .card, #page-setup .card { text-align: center; }
.stats { margin: 12px 0; font-size: 15px; line-height: 2; }
.stats span { color: var(--accent); font-weight: 600; }
.encourage { font-size: 18px; color: var(--gold); margin: 12px 0; font-weight: 600; }

/* Perfect result */
.card.perfect {
  border-color: var(--gold);
  box-shadow: 0 0 40px rgba(255,215,0,0.25), 0 0 80px rgba(255,215,0,0.1);
}
#resultTitle.perfect-title {
  font-size: 36px; color: var(--gold);
  text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 40px rgba(255,215,0,0.3);
  animation: titleGlow 1.5s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  from { text-shadow: 0 0 20px rgba(255,215,0,0.4), 0 0 40px rgba(255,215,0,0.2); }
  to { text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 60px rgba(255,215,0,0.4); }
}
.stats.perfect-stats span { color: var(--gold); }
.confetti {
  position: fixed; top: -10px; z-index: 200; pointer-events: none;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}
.remaining { text-align: center; font-size: 14px; color: var(--text-dim); margin: 10px 0; }

.score-pop {
  position: absolute; font-size: 22px; font-weight: 700;
  color: var(--success); pointer-events: none; z-index: 100;
  animation: scorePop 0.8s ease-out forwards;
}

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px auto; max-width: 440px; padding: 0 8px; }
.btn-option {
  display: block; width: 100%; margin: 0; padding: 16px 10px;
  border: 2px solid var(--border-card); border-radius: 14px;
  background: rgba(10,20,50,0.7); color: var(--text);
  font-size: 17px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all 0.2s; text-align: center;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
@media (hover: hover) { .btn-option:hover { border-color: var(--accent); background: rgba(0,229,255,0.12); transform: scale(1.03); } }
.btn-option:active { transform: scale(0.96); }
.btn-option.correct-flash { border-color: var(--success); background: rgba(105,240,174,0.2); animation: optionCorrect 0.4s; }
.btn-option.wrong-flash { border-color: var(--danger); background: rgba(255,23,68,0.2); animation: optionWrong 0.4s; }
@keyframes optionCorrect { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes optionWrong { 0%,100%{transform:scale(1)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
@keyframes scorePop {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-60px); opacity: 0; }
}

/* Round Complete */
.round-complete-wrap { text-align: center; padding: 20px 10px; }
.round-complete-title {
  font-size: 32px; font-weight: 800; color: var(--gold);
  text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 12px;
}
.round-complete-sub {
  font-size: 18px; color: var(--accent); margin-bottom: 16px;
}
.round-complete-stats {
  font-size: 15px; color: var(--text-dim); margin-bottom: 24px;
}
</style>
<script>
// Early stub — works even if CDN scripts block
function goToPage(page) {
  var cards = document.getElementsByClassName('card');
  for (var i = 0; i < cards.length; i++) cards[i].classList.remove('active');
  var el = document.getElementById('page-' + page);
  if (el) el.classList.add('active');
  if (page === 'setup') {
    var s1 = document.getElementById('setupStep1');
    var s2 = document.getElementById('setupStep2');
    if (s1) s1.style.display = 'block';
    if (s2) s2.style.display = 'none';
    var pn = document.getElementById('playerName');
    if (pn) { pn.value = ''; setTimeout(function(){ pn.focus(); }, 100); }
  }
}
function step1Next() {
  var nameEl = document.getElementById('playerName');
  var name = (nameEl.value || '').trim();
  if (!name) { alert('请输入名字'); return; }
  window._playerName = name;
  window._step1Done = true;
  var s1 = document.getElementById('setupStep1');
  var s2 = document.getElementById('setupStep2');
  if (s1) s1.style.display = 'none';
  if (s2) s2.style.display = 'block';
  var g = document.getElementById('step2Greeting');
  if (g) g.textContent = name;
  var ai = document.getElementById('attemptsInfo');
  if (ai) ai.textContent = '正在加载...';
  // 后续逻辑由主脚本的 window._step1Done 检测接管
}
function updateAttemptsDisplay() {
  var ai = document.getElementById('attemptsInfo');
  if (ai && ai.textContent === '正在加载...') ai.textContent = '剩余挑战次数：3 / 3';
}
</script>
</head>
<body>

<canvas class="stars" id="starsCanvas"></canvas>
<button class="sound-btn" id="soundToggle" title="音乐开关">🔊</button>

<div class="container">

  <!-- Entry -->
  <div class="card active" id="page-entry">
    <h1>单词射击大作战</h1>
    <h2>Word Shooting</h2>
    <p style="text-align:center;color:var(--text-dim);margin-bottom:20px;font-size:15px;">瞄准飞来的单词，输入正确翻译击落它！</p>
    <button class="btn btn-fire" onclick="goToPage('setup')">开始挑战</button>
  </div>

  <!-- Setup -->
  <div class="card" id="page-setup">
    <div id="setupStep1">
      <h3>你的名字</h3>
      <p style="text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:14px;">请输入你的名字开始挑战</p>
      <label>名字</label>
      <input type="text" id="playerName" placeholder="输入名字（最多20字）" maxlength="20">
      <button class="btn btn-primary" id="btnNextStep" onclick="step1Next()">下一步</button>
      <button class="btn btn-outline btn-small" onclick="goToPage('entry')">返回</button>
    </div>
    <div id="setupStep2" style="display:none">
      <h3>你好，<span id="step2Greeting"></span>！</h3>
      <p style="text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:14px;">选择辅导老师，准备射击</p>
      <label>选择辅导老师</label>
      <select id="teacherSelect"><option value="">加载中...</option></select>
      <p class="remaining" id="attemptsInfo"></p>
      <button class="btn btn-fire" id="btnStartGame" onclick="startGame()" disabled>开始射击</button>
      <button class="btn btn-outline btn-small" id="btnBackToStep1">返回修改名字</button>
    </div>
  </div>

  <!-- Game -->
  <div class="card" id="page-game">
    <div class="status-bar">
      <div class="status-item">🔫 <span id="statusRound">1/5</span></div>
      <div class="status-item">✅ <span id="statusCorrect">0</span></div>
      <div class="status-item">❌ <span id="statusWrong">0</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="word-display-area" id="wordDisplayArea">
      <div class="word-fly" id="wordFlyText"></div>
    </div>
    <div class="timer-text" id="timerText">5</div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    <div class="options-grid" id="optionsGrid">
      <button class="btn btn-option" data-idx="0"></button>
      <button class="btn btn-option" data-idx="1"></button>
      <button class="btn btn-option" data-idx="2"></button>
      <button class="btn btn-option" data-idx="3"></button>
    </div>
    <div class="feedback-text" id="feedbackText"></div>
    <button class="btn btn-outline btn-small" style="margin-top:20px;" onclick="endGameEarly()">🏳️ 放弃挑战</button>
  </div>

  <!-- Round Complete Overlay -->
  <div class="card" id="page-round-complete">
    <div class="round-complete-wrap">
      <h3 class="round-complete-title" id="roundCompleteTitle">第 1 轮结束</h3>
      <p class="round-complete-sub" id="roundCompleteSub">难度升级！准备好迎接更强的单词了吗？</p>
      <p class="round-complete-stats" id="roundCompleteStats"></p>
      <button class="btn btn-fire" onclick="advanceRound()">进入下一轮</button>
      <button class="btn btn-outline btn-small" style="margin-top:12px;" onclick="endGameEarly()">🏳️ 放弃挑战</button>
    </div>
  </div>

  <!-- Result -->
  <div class="card" id="page-result">
    <h3 id="resultTitle">挑战结束</h3>
    <div class="encourage" id="encourageText"></div>
    <div class="stats" id="resultStats"></div>
    <table class="leaderboard" id="leaderboardTable"></table>
    <p style="text-align:center;color:var(--text-dim);font-size:13px;margin:8px 0;" id="leaderboardYourPos"></p>
    <div class="btn-row">
      <button class="btn btn-outline btn-small" onclick="downloadStudentCSV()">📥 下载我的记录</button>
      <button class="btn btn-fire" onclick="restartGame()">再来一局</button>
      <button class="btn btn-outline btn-small" onclick="goToPage('entry')">返回首页</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'"></script>
<script src="shared.js"></script>
<script>
// ============ State ============
const DEFAULT_WORDS = [
  {en:'apple',zh:'苹果'},{en:'beautiful',zh:'美丽的'},{en:'cat',zh:'猫'},{en:'dance',zh:'跳舞'},
  {en:'elephant',zh:'大象'},{en:'flower',zh:'花'},{en:'garden',zh:'花园'},{en:'happy',zh:'快乐的'},
  {en:'island',zh:'岛屿'},{en:'juice',zh:'果汁'},{en:'king',zh:'国王'},{en:'lion',zh:'狮子'},
  {en:'mountain',zh:'山'},{en:'night',zh:'夜晚'},{en:'ocean',zh:'海洋'},{en:'piano',zh:'钢琴'},
  {en:'queen',zh:'女王'},{en:'river',zh:'河流'},{en:'sun',zh:'太阳'},{en:'tiger',zh:'老虎'},
  {en:'umbrella',zh:'雨伞'},{en:'village',zh:'村庄'},{en:'water',zh:'水'},{en:'yellow',zh:'黄色'}
];
const STATE = {
  page: 'entry',
  playerName: '',
  teacher: '',
  editionId: null,
  words: [],
  remainingAttempts: 3,
  currentRound: 1,
  currentQuestion: 0,
  roundQuestionIndex: 0,
  totalQuestions: 30,
  totalRounds: 3,
  correctCount: 0,
  wrongCount: 0,
  totalTime: 0,
  gameStartTime: 0,
  questionStartTime: 0,
  questionTimer: null,
  questionTimeLeft: 5,
  pairLog: [],
  roundWords: [],
  gameCompleted: false,
  gameActive: false,
  currentWord: null,
  currentAnswer: '',
  soundOn: true
};

// ============ Audio Engine ============
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playTone(freq, type, duration, vol, rampDown) {
  if (!STATE.soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration - rampDown);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playSequence(notes, vol) {
  if (!STATE.soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    let t = ctx.currentTime;
    notes.forEach(function(n) {
      var freq = n[0], dur = n[1], type = n[2] || 'sine';
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.01);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + dur);
      t += dur;
    });
  } catch(e) {}
}

function sfxBiu() { playSequence([[1200,0.05,'square'],[1600,0.06,'square'],[2000,0.1,'square']], 0.18); }
function sfxMiss() { playTone(120, 'sawtooth', 0.35, 0.12, 0.03); }
function sfxRoundClear() { playSequence([[523,0.08],[659,0.08],[784,0.08],[1047,0.2]], 0.15); }
function sfxVictory() {
  playSequence([[523,0.12],[659,0.12],[784,0.12],[1047,0.12],[784,0.12],[1047,0.12],[1319,0.35]], 0.16);
}
function sfxTick() { playTone(800, 'square', 0.05, 0.06, 0.01); }

let bgmInterval = null, bgmGain = null;
function startBGM() {
  if (!STATE.soundOn) return;
  try {
    var ctx = getAudioCtx();
    if (!ctx) return;
    bgmGain = ctx.createGain();
    bgmGain.gain.setValueAtTime(0.03, ctx.currentTime);
    bgmGain.connect(ctx.destination);
    function loop() {
      var osc = ctx.createOscillator();
      osc.type = 'triangle';
      var notes = [110, 164.81, 196, 164.81, 130.81, 146.83, 174.61, 146.83];
      var t = ctx.currentTime;
      notes.forEach(function(f) {
        osc.frequency.setValueAtTime(f, t);
        t += 0.12;
      });
      var f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 400;
      osc.connect(f); f.connect(bgmGain);
      osc.start(); osc.stop(t);
    }
    loop();
    bgmInterval = setInterval(loop, 960);
  } catch(e) {}
}

function stopBGM() {

  }
}

// ============ Stars Canvas ============
function initStars() {
  var canvas = document.getElementById('starsCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var ctx = canvas.getContext('2d');
  var stars = [];
  for (var i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    });
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(function(s) {
      s.twinkle += s.speed;
      var alpha = 0.3 + Math.sin(s.twinkle) * 0.4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,210,255,' + alpha + ')';
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize', function() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
}
try { initStars(); } catch(e) { console.warn('Stars init failed:', e); }

// ============ Build Round Words (sorted by difficulty) ============
function buildRoundWords() {
  var pool = STATE.words.slice();
  // Sort by word length (shorter = easier)
  pool.sort(function(a, b) { return a.en.length - b.en.length; });
  var perRound = 10;
  STATE.roundWords = [];
  for (var i = 0; i < STATE.totalRounds; i++) {
    STATE.roundWords.push(pool.slice(i * perRound, (i + 1) * perRound));
  }
  // Shuffle within each round for variety, but keep difficulty tiers
  for (var r = 0; r < STATE.totalRounds; r++) {
    var arr = STATE.roundWords[r];
    for (var j = arr.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = arr[j]; arr[j] = arr[k]; arr[k] = t;
    }
  }
}

// ============ Question Flow ============
function getQuestionType() {
  // Within each round: first 5 zh2en, last 5 en2zh
  return STATE.roundQuestionIndex < 5 ? 'zh2en' : 'en2zh';
}

function pickCurrentWord() {
  var roundIdx = STATE.currentRound - 1;
  return STATE.roundWords[roundIdx][STATE.roundQuestionIndex];
}

function nextQuestion() {
  // Check if round completed
  if (STATE.roundQuestionIndex >= 10) {
    if (STATE.currentRound >= STATE.totalRounds) {
      endGame(true);
      return;
    }
    // Transition to next round
    showRoundComplete();
    return;
  }

  STATE.currentQuestion++;
  var qType = getQuestionType();
  var word = pickCurrentWord();

  STATE.currentWord = word;
  STATE.currentAnswer = qType === 'zh2en' ? word.en.toLowerCase().trim() : word.zh.trim();
  STATE.questionTimeLeft = 5;
  STATE.questionStartTime = Date.now();

  // Update UI - strip trailing pipes from display
  document.getElementById('wordFlyText').textContent = (qType === 'zh2en' ? word.zh : word.en).replace(/\|+$/g, '');
  document.getElementById('wordFlyText').classList.remove('fast');
  void document.getElementById('wordFlyText').offsetWidth;
  document.getElementById('wordFlyText').classList.add('fast');
  document.getElementById('feedbackText').textContent = '';
  document.getElementById('feedbackText').className = 'feedback-text';
  document.getElementById('timerText').textContent = '5';
  document.getElementById('timerText').classList.remove('urgent');
  document.getElementById('timerFill').style.width = '100%';

  generateOptions();

  updateStatusBar();
  updateProgress();
  startQuestionTimer();
}

function startQuestionTimer() {
  clearInterval(STATE.questionTimer);
  var startTime = Date.now();
  STATE.questionTimer = setInterval(function() {
    var elapsed = (Date.now() - startTime) / 1000;
    var remaining = Math.max(0, 5 - elapsed);
    STATE.questionTimeLeft = remaining;
    document.getElementById('timerText').textContent = Math.ceil(remaining);
    document.getElementById('timerFill').style.width = (remaining / 5 * 100) + '%';

    if (remaining <= 2 && remaining > 0) {
      document.getElementById('timerText').classList.add('urgent');
      sfxTick();
    }

    if (remaining <= 0) {
      clearInterval(STATE.questionTimer);
      handleTimeout();
    }
  }, 100);
}

function handleTimeout() {
  STATE.wrongCount++;
  STATE.pairLog.push({
    round: STATE.currentRound,
    question: STATE.currentQuestion,
    word: STATE.currentWord.en,
    type: getQuestionType(),
    correct: STATE.currentAnswer,
    userAnswer: '(超时)',
    result: 'wrong'
  });

  document.getElementById('feedbackText').textContent = '⏰ 时间到！正确答案：' + STATE.currentAnswer;
  document.getElementById('feedbackText').className = 'feedback-text wrong';
  sfxMiss();

  // Miss flash
  var flash = document.createElement('div');
  flash.className = 'miss-flash';
  document.body.appendChild(flash);
  setTimeout(function() { flash.remove(); }, 350);

  updateStatusBar();

  STATE.roundQuestionIndex++;

  setTimeout(function() {
    nextQuestion();
  }, 1200);
}

// ============ Options Mode ============
function generateOptions() {
  var correct = STATE.currentAnswer;
  var qType = getQuestionType();
  var distractors = [];
  var pool = STATE.words.filter(function(w) {
    var val = qType === 'zh2en' ? w.en.toLowerCase().trim() : w.zh.trim();
    return val !== correct.toLowerCase() && !distractors.includes(val);
  });
  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  for (var k = 0; k < pool.length && distractors.length < 3; k++) {
    var val = qType === 'zh2en' ? pool[k].en.toLowerCase().trim() : pool[k].zh.trim();
    if (!distractors.includes(val)) distractors.push(val);
  }
  if (distractors.length < 3) {
    var fallback = qType === 'zh2en' ? ['apple','book','cat'] : ['苹果','书','猫'];
    for (var f = 0; f < fallback.length && distractors.length < 3; f++) {
      if (!distractors.includes(fallback[f]) && fallback[f] !== correct.toLowerCase()) distractors.push(fallback[f]);
    }
  }
  var options = [correct].concat(distractors);
  for (var m = options.length - 1; m > 0; m--) { var n = Math.floor(Math.random() * (m + 1)); var tmp = options[m]; options[m] = options[n]; options[n] = tmp; }
  var btns = document.querySelectorAll('#optionsGrid .btn-option');
  btns.forEach(function(btn, i) {
    btn.textContent = options[i];
    btn.className = 'btn btn-option';
    btn.disabled = false;
    btn.onclick = function() { selectOption(i, options, correct); };
  });
}

function selectOption(idx, options, correct) {
  if (!STATE.gameActive) return;
  clearInterval(STATE.questionTimer);

  var userAnswer = options[idx];
  var isCorrect = userAnswer.toLowerCase() === correct.toLowerCase();

  STATE.totalTime += Date.now() - STATE.questionStartTime;
  STATE.pairLog.push({
    round: STATE.currentRound,
    question: STATE.currentQuestion,
    word: STATE.currentWord.en,
    type: getQuestionType(),
    correct: correct,
    userAnswer: userAnswer,
    result: isCorrect ? 'correct' : 'wrong'
  });

  var btns = document.querySelectorAll('#optionsGrid .btn-option');
  btns.forEach(function(btn, i) {
    btn.disabled = true;
    if (options[i].toLowerCase() === correct.toLowerCase()) { btn.classList.add('correct-flash'); }
  });
  btns[idx].classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');

  if (isCorrect) {
    STATE.correctCount++;
    document.getElementById('feedbackText').textContent = '命中！';
    document.getElementById('feedbackText').className = 'feedback-text correct';
    sfxBiu(); spawnExplosion();
    var flash = document.createElement('div'); flash.className = 'hit-flash'; document.body.appendChild(flash);
    setTimeout(function() { flash.remove(); }, 350);
  } else {
    STATE.wrongCount++;
    document.getElementById('feedbackText').textContent = '未命中！正确答案：' + correct;
    document.getElementById('feedbackText').className = 'feedback-text wrong';
    sfxMiss();
    var flash2 = document.createElement('div'); flash2.className = 'miss-flash'; document.body.appendChild(flash2);
    setTimeout(function() { flash2.remove(); }, 350);
  }

  updateStatusBar();

  STATE.roundQuestionIndex++;

  setTimeout(function() { nextQuestion(); }, 1000);
}

// ============ Explosion Effect ============
function spawnExplosion() {
  var area = document.getElementById('wordDisplayArea');
  var rect = area.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;

  var container = document.createElement('div');
  container.className = 'explosion';
  container.style.left = cx + 'px';
  container.style.top = cy + 'px';
  document.body.appendChild(container);

  var colors = ['#00e5ff', '#ff4081', '#ffd740', '#69f0ae', '#fff'];
  for (var i = 0; i < 20; i++) {
    var p = document.createElement('div');
    p.className = 'particle-burst';
    var angle = Math.random() * Math.PI * 2;
    var dist = 30 + Math.random() * 80;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = (3 + Math.random() * 6) + 'px';
    p.style.height = p.style.width;
    container.appendChild(p);
  }

  setTimeout(function() { container.remove(); }, 700);
}

async function loadLeaderboard(myAccuracy, myTime) {
  try {
    var res = await window.SB.from('game_records').select('*')
      .eq('game_type', 'shooting').eq('rounds', STATE.totalRounds).eq('accuracy', 100)
      .order('time', { ascending: true })
      .limit(50);

    var all = res.data || [];
    // Deduplicate: keep only best (fastest) time per player
    var bestMap = {};
    all.forEach(function(r) {
      var key = r.name + '|||' + r.teacher;
      if (!bestMap[key] || r.time < bestMap[key].time) {
        bestMap[key] = r;
      }
    });
    var data = Object.values(bestMap);
    data.sort(function(a, b) { return a.time - b.time; });
    data = data.slice(0, 10);

    var tbody = document.getElementById('leaderboardTable');
    var html = '<tr><th>排名</th><th>姓名</th><th>老师</th><th>正确率</th><th>用时</th><th>日期</th></tr>';
    var myRank = -1;

    if (data.length > 0) {
      data.forEach(function(r, i) {
        var isMe = r.name === STATE.playerName && r.teacher === STATE.teacher;
        if (isMe) myRank = i + 1;
        html += '<tr class="' + (isMe ? 'highlight' : '') + '">' +
          '<td>' + (i + 1) + '</td><td>' + r.name + '</td><td>' + r.teacher + '</td>' +
          '<td>100%</td><td>' + formatTime(r.time) + '</td><td>' + r.date + '</td>' +
          '</tr>';
      });
    }
    if (data.length === 0) {
      html += '<tr><td colspan="6" style="padding:16px;color:var(--text-dim);">暂无满分通关记录，快来挑战吧！</td></tr>';
    }
    tbody.innerHTML = html;

    if (myRank > 0) {
      document.getElementById('leaderboardYourPos').textContent = '你的排名：第 ' + myRank + ' 名（共 ' + data.length + ' 人）';
    } else if (myAccuracy >= 100) {
      document.getElementById('leaderboardYourPos').textContent = '你本次用时 ' + formatTime(myTime) + '，未进入前十';
    } else if (STATE.gameCompleted) {
      document.getElementById('leaderboardYourPos').textContent = '排行榜仅收录满分通关，继续加油！';
    } else {
      document.getElementById('leaderboardYourPos').textContent = '';
    }
  } catch(e) {
    document.getElementById('leaderboardTable').innerHTML = '<tr><td colspan="6" style="padding:16px;color:var(--text-dim);">排行榜加载失败</td></tr>';
  }
}

// ============ CSV Download ============
function downloadStudentCSV() {
  var accuracy = STATE.correctCount + STATE.wrongCount > 0
    ? Math.round((STATE.correctCount / (STATE.correctCount + STATE.wrongCount)) * 100) : 0;

  var csv = '\uFEFF姓名,老师,日期,用时(秒),正确数,错误数,正确率(%),通关轮次\n';
  csv += STATE.playerName + ',' + STATE.teacher + ',' + new Date().toISOString().split('T')[0] + ',' +
    (STATE.totalTime / 1000).toFixed(1) + ',' + STATE.correctCount + ',' + STATE.wrongCount + ',' + accuracy + ',' + STATE.totalRounds + '/' + STATE.totalRounds + '\n';
  csv += '\n答题详情\n轮次,题号,类型,单词,正确答案,你的答案,结果\n';

  STATE.pairLog.forEach(function(q) {
    var typeLabel = q.type === 'en2zh' ? '英→中' : '中→英';
    var resultLabel = q.result === 'correct' ? '正确' : '错误';
    csv += q.round + ',' + q.question + ',' + typeLabel + ',' + q.word + ',' + q.correct + ',' + q.userAnswer + ',' + resultLabel + '\n';
  });

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = STATE.playerName + '_射击大作战记录_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ============ Restart ============
function restartGame() {
  STATE.gameActive = false;
  stopBGM();
  clearInterval(STATE.questionTimer);
  STATE.currentRound = 1;
  STATE.currentQuestion = 0;
  STATE.roundQuestionIndex = 0;
  STATE.correctCount = 0;
  STATE.wrongCount = 0;
  STATE.totalTime = 0;
  STATE.pairLog = [];
  STATE.roundWords = [];
  STATE.gameCompleted = false;
  goToPage('setup');
  checkAttempts();
}

// ============ Confetti for Perfect Result ============
function spawnConfetti() {
  var shapes = ['■','▲','●','★','♦'];
  var colors = ['#ffd740','#ff4081','#69f0ae','#00e5ff','#ff6e40','#e040fb','#fff'];
  for (var i = 0; i < 50; i++) {
    setTimeout(function() {
      var el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.fontSize = (10 + Math.random() * 18) + 'px';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (2 + Math.random() * 3) + 's';
      el.style.animationDelay = Math.random() * 0.5 + 's';
      el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 4000);
    }, i * 40);
  }
}

// ============ Helpers ============
function formatTime(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m > 0 ? m + '分' + sec + '秒' : sec + '秒';
}

// ============ Leave Protection ============
window.addEventListener('beforeunload', function(e) {
  if (STATE.gameActive) {
    e.preventDefault();
    e.returnValue = '游戏进行中，确定离开吗？';
    return e.returnValue;
  }
});

// ============ Init ============
goToPage('entry');
initGameWords();

// 如果 early script 已经执行了 step1Next，同步状态
if (window._playerName && window._step1Done) {
  STATE.playerName = window._playerName;
  populateTeacherSelect().then(function(){
    var teacher = document.getElementById('teacherSelect');
    if (teacher && teacher.value) { 
      STATE.teacher = teacher.value; 
      checkAttempts(); 
    }
  });
}
</script>
