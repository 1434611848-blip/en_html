<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👩‍🏫 单词小侦探 · 参与记录</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:"微软雅黑","PingFang SC",sans-serif; background:linear-gradient(160deg,#fdeff9 0%,#e3f2fd 100%); color:#4a4a4a; min-height:100vh; padding:16px; }
  h1{ text-align:center; font-size:24px; color:#ff6b9d; margin:10px 0 4px; }
  .sub{ text-align:center; font-size:13px; color:#888; margin-bottom:14px; }
  .wrap{ max-width:760px; margin:0 auto; }
  .toolbar{ display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .btn{ padding:10px 18px; font-size:15px; border-radius:12px; border:2px solid #ffd6e7; background:#fff; color:#ff6b9d; font-weight:bold; cursor:pointer; }
  .btn.pink{ background:#ff6b9d; color:#fff; border-color:#ff6b9d; }
  .btn:active{ opacity:.7; }
  .stat{ text-align:center; font-size:14px; color:#ff6b9d; font-weight:bold; margin-bottom:12px; }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .row{ display:flex; align-items:center; background:#fff; border-radius:12px; padding:10px 12px; border:2px solid #ffd6e7; font-size:13px; }
  .info{ flex:1; line-height:1.5; }
  .info b{ color:#2b8fd6; }
  .acc{ flex:0 0 60px; text-align:center; font-weight:bold; color:#ff6b9d; }
  .empty{ text-align:center; color:#aaa; padding:40px 0; }
  .del{ flex:0 0 auto; margin-left:8px; padding:6px 12px; font-size:13px; border-radius:10px; border:2px solid #ffd0d0; background:#fff; color:#e74c3c; font-weight:bold; cursor:pointer; }
  .del:active{ opacity:.6; }
  .btn.red{ background:#e74c3c; color:#fff; border-color:#e74c3c; }
  .seg{ display:inline-flex; border:2px solid #ffd6e7; border-radius:12px; overflow:hidden; }
  .seg-btn{ padding:9px 16px; font-size:14px; border:none; background:#fff; color:#ff6b9d; font-weight:bold; cursor:pointer; }
  .seg-btn.active{ background:#ff6b9d; color:#fff; }
</style>
<script src="supabase.js"></script>
</head>
<body>
  <h1>👩‍🏫 参与记录</h1>
  <div class="sub">全部学生的单词检测参与记录（云端）</div>
  <div class="wrap">
    <div class="toolbar">
      <div class="seg">
        <button class="seg-btn active" id="weekBtn">本周</button>
        <button class="seg-btn" id="allBtn">全部</button>
      </div>
      <button class="btn pink" id="downloadBtn">⬇️ 下载记录（CSV）</button>
      <button class="btn red" id="clearBtn">🗑 清空全部记录</button>
    </div>
    <div class="stat" id="stat"></div>
    <div class="list" id="list"></div>
  </div>

<script>
const $ = id => document.getElementById(id);

function fmtDate(ts){ const d=new Date(ts); if(isNaN(d)) return ''; const p=n=>(''+n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

function csvEscape(v){ v=''+(v==null?'':v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }

function mapRec(r){
  return {
    id: r.id,
    name: r.student_name||'',
    teacher: r.teacher||'',
    version: r.version||'',
    game: r.game||'',
    correct: r.correct||0,
    total: r.total||0,
    score: r.score||0,
    accuracy: r.total ? Math.round((r.correct||0)/r.total*100) : 0,
    date: r.submitted_at
  };
}

let mode = 'week';

// 本周一 00:00（按设备本地时区，通常为北京时间）对应的 ISO 字符串
function weekStartISO(){
  const now = new Date();
  const d = now.getDay();              // 0=周日,1=周一...6=周六
  const diff = (d === 0 ? -6 : 1 - d); // 回退到本周一
  const mon = new Date(now);
  mon.setDate(now.getDate() + diff);
  mon.setHours(0, 0, 0, 0);
  return mon.toISOString();
}

async function loadRecords(){
  if(!window.CloudBox) return [];
  try{
    const since = (mode === 'week') ? weekStartISO() : null;
    const rows = await CloudBox.fetchWordScores(null, null, since);
    return (rows||[]).map(mapRec);
  }catch(e){ console.error('读取云端成绩失败：', e); return []; }
}

let allRecs = [];

async function render(){
  const list=$('list');
  list.innerHTML='<div class="empty">加载中…</div>';
  allRecs = await loadRecords();
  $('stat').textContent = (mode === 'week' ? '本周' : '全部') + `共 ${allRecs.length} 条参与记录`;
  if(!allRecs.length){ list.innerHTML='<div class="empty">暂无参与记录。</div>'; return; }
  list.innerHTML=allRecs.map((r)=>`
    <div class="row">
      <div class="info">
        <b>${r.name}</b> ｜ ${r.teacher} ｜ ${r.version}${r.game?(' ｜ '+r.game):''}<br>
        <span style="color:#999">正确率 ${r.accuracy}% ｜ 答对 ${r.correct}/${r.total}${r.score?(' ｜ 得分 '+r.score):''} ｜ ${fmtDate(r.date)}</span>
      </div>
      <div class="acc">${r.accuracy}%</div>
      <button class="del" data-id="${r.id}">删除</button>
    </div>`).join('');
}

function downloadCSV(){
  if(!allRecs.length){ alert('暂无记录可下载'); return; }
  const header=['姓名','老师','教材版本','游戏','正确率','答对','总数','得分','时间'];
  const lines=[header.join(',')];
  for(const r of allRecs){
    lines.push([r.name, r.teacher, r.version, r.game, r.accuracy+'%', r.correct, r.total, r.score, fmtDate(r.date)].map(csvEscape).join(','));
  }
  const csv='\ufeff'+lines.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='单词检测记录_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function deleteOne(id){
  if(!confirm('确定删除这条记录？')) return;
  try{
    await CloudBox.deleteWordScore(id);
    allRecs = allRecs.filter(r=>r.id!==id);
    $('stat').textContent = `共 ${allRecs.length} 条参与记录`;
    renderList();
  }catch(e){
    alert('删除失败：' + (e && e.message ? e.message : e));
  }
}

async function clearAll(){
  if(!allRecs.length){ alert('暂无记录可清空'); return; }
  if(!confirm('确定清空全部 ' + allRecs.length + ' 条记录？删除后将从云端移除（可在 Supabase 中恢复）。')) return;
  try{
    for(const r of allRecs){ await CloudBox.deleteWordScore(r.id); }
    allRecs = [];
    $('stat').textContent = '共 0 条参与记录';
    renderList();
    alert('已清空全部记录');
  }catch(e){
    alert('清空失败：' + (e && e.message ? e.message : e));
  }
}

function setMode(m){
  if(mode === m) return;
  mode = m;
  $('weekBtn').classList.toggle('active', m === 'week');
  $('allBtn').classList.toggle('active', m === 'all');
  render();
}

$('downloadBtn').addEventListener('click', downloadCSV);
$('clearBtn').addEventListener('click', clearAll);
$('weekBtn').addEventListener('click', () => setMode('week'));
$('allBtn').addEventListener('click', () => setMode('all'));
$('list').addEventListener('click', function(e){
  const btn = e.target.closest('.del');
  if(btn){ deleteOne(btn.getAttribute('data-id')); }
});
render();
</script>
</body>
</html>
