<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词检测排行榜 · 单词小侦探</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #fff0f6 0%, #ffe0ec 100%);
    color:#5a3a48; min-height:100vh; padding:16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .hero { text-align:center; padding: 18px 0 10px; }
  .hero h1 { font-size: 24px; color:#dc325a; }
  .hero p { font-size:13px; color:#b07a8c; margin-top:4px; }

  .filters {
    background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:14px;
    box-shadow:0 6px 18px rgba(220,80,140,.15);
    display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
  }
  .filters .f { flex:1; min-width:140px; }
  .filters label { display:block; font-size:12px; color:#a86a7c; margin-bottom:5px; font-weight:bold; }
  .filters select {
    width:100%; padding:10px 12px; font-size:14px; border:1.5px solid #ffc6da;
    border-radius:12px; outline:none; background:#fff; color:#5a3a48; font-family:inherit;
  }
  .filters select:focus { border-color:#ff5e8a; }
  .refresh-row { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; color:#888; }
  .refresh-row input { accent-color:#dc325a; }

  .panel { background:#fff; border-radius:18px; box-shadow:0 6px 18px rgba(220,80,140,.15); overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  thead th { background:#fff0f6; padding:12px 10px; text-align:left; color:#dc325a; font-weight:bold; border-bottom:2px solid #ffd0e0; }
  thead th:first-child { border-radius:10px 0 0 0; }
  thead th:last-child { border-radius:0 10px 0 0; }
  tbody td { padding:11px 10px; border-bottom:1px solid #f3eef2; color:#555; }
  tbody tr:hover { background:#fff8fb; }
  .rank-badge {
    display:inline-block; width:26px; height:26px; border-radius:50%;
    text-align:center; line-height:26px; font-size:13px; font-weight:bold; color:#fff;
  }
  .rank-1 { background:linear-gradient(135deg,#FFD700,#FFA000); }
  .rank-2 { background:linear-gradient(135deg,#C0C0C0,#909090); }
  .rank-3 { background:linear-gradient(135deg,#CD7F32,#A0522D); }
  .rank-other { background:#d9c2cc; color:#fff; }
  .s-name { font-weight:bold; color:#2b2b2b; }
  .s-score { font-weight:bold; color:#dc325a; }
  .empty-state { text-align:center; padding:50px 20px; color:#bbb; font-size:15px; }
  .src-info { font-size:12px; color:#888; margin:8px 2px 0; }
  .src-info .ok { color:#0a7a3b; }
  .src-info .err { color:#a4262c; font-weight:600; }
  a.back { display:inline-block; margin-top:14px; color:#dc325a; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🏆 单词检测排行榜</h1>
    <p>同一学生只显示最优成绩</p>
  </div>

  <div class="filters">
    <div class="f">
      <label>老师</label>
      <select id="teacherSel"><option value="__all">全部老师</option></select>
    </div>
    <div class="f">
      <label>教材版本</label>
      <select id="versionSel"><option value="__all">全部版本</option></select>
    </div>
  </div>

  <div class="refresh-row">
    <label><input type="checkbox" id="autoRefresh" checked> 自动刷新</label>
    <span id="updatedAt"></span>
  </div>

  <div class="panel">
    <div id="content"><div class="empty-state">⏳ 加载中…</div></div>
  </div>
  <div class="src-info" id="srcInfo"></div>
  <a class="back" href="word-detect-game.html">‹ 返回游戏</a>
</div>

<script src="js/common.js?v=20260812wd"></script>
<script src="js/supabase.js?v=20260812wd"></script>
<script src="js/wordlists.js?v=20260812wd"></script>
<script>
Common.injectGlobalStyle();

var teacherSel = document.getElementById('teacherSel');
var versionSel = document.getElementById('versionSel');
var autoRefresh = document.getElementById('autoRefresh');
var autoTimer = null;

// 初始化下拉
CloudBox.fetchTeachers().then(function(ts){
  ts.forEach(function(t){
    var o = document.createElement('option');
    o.value = t.name; o.textContent = t.name;
    teacherSel.appendChild(o);
  });
}).catch(function(err){
  console.warn('加载老师失败：', err);
});
Object.keys(WORD_LISTS).forEach(function(v){
  var o = document.createElement('option');
  o.value = v; o.textContent = v;
  versionSel.appendChild(o);
});

function bestByStudent(rows){
  // 每个学生只保留最高分一条
  var map = {};
  rows.forEach(function(r){
    var key = (r.student_name||'').trim().toLowerCase();
    var cur = map[key];
    if(!cur || r.score > cur.score ||
       (r.score === cur.score && new Date(r.submitted_at) > new Date(cur.submitted_at))){
      map[key] = r;
    }
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return b.score - a.score; });
}

function render(){
  var teacher = teacherSel.value;
  var version = versionSel.value;
  document.getElementById('content').innerHTML = '<div class="empty-state">⏳ 加载中…</div>';
  CloudBox.fetchWordScores(teacher, version).then(function(rows){
    var best = bestByStudent(rows);
    document.getElementById('updatedAt').textContent = '更新于 ' + Common.formatDateTime(new Date().toISOString());
    document.getElementById('srcInfo').innerHTML = '<span class="ok">☁ 云端数据 · 共 ' + best.length + ' 名学生（已按最优成绩去重）</span>';

    if(!best.length){
      document.getElementById('content').innerHTML = '<div class="empty-state">📭 暂无成绩记录<br><small>学生完成检测并上传后，这里会显示排行榜</small></div>';
      return;
    }
    var html = '<table><thead><tr><th>排名</th><th>姓名</th><th>老师</th><th>版本</th><th>得分</th><th>正确率</th><th>时间</th></tr></thead><tbody>';
    best.forEach(function(r, i){
      var rate = r.total ? Math.round(r.correct / r.total * 100) : 0;
      var badge = i===0 ? '<span class="rank-badge rank-1">🥇</span>'
                : i===1 ? '<span class="rank-badge rank-2">🥈</span>'
                : i===2 ? '<span class="rank-badge rank-3">🥉</span>'
                : '<span class="rank-badge rank-other">'+(i+1)+'</span>';
      html += '<tr>'
        + '<td>'+badge+'</td>'
        + '<td class="s-name">'+Common.escapeHtml(r.student_name)+'</td>'
        + '<td>'+Common.escapeHtml(r.teacher)+'</td>'
        + '<td>'+Common.escapeHtml(r.version)+'</td>'
        + '<td class="s-score">'+r.score+'</td>'
        + '<td>'+rate+'%</td>'
        + '<td style="font-size:12px;color:#999">'+Common.formatDateTime(r.submitted_at)+'</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('content').innerHTML = html;
  }).catch(function(err){
    console.warn('加载失败：', err);
    document.getElementById('content').innerHTML = '<div class="empty-state" style="color:#a4262c;">⚠ 加载失败：'+Common.escapeHtml(err.message)+'</div>';
    document.getElementById('srcInfo').innerHTML = '<span class="err">⚠ 云端连接失败</span>';
  });
}

[teacherSel, versionSel].forEach(function(sel){
  sel.addEventListener('change', render);
});
autoRefresh.addEventListener('change', function(){
  if(autoRefresh.checked) startAuto(); else stopAuto();
});
function startAuto(){ stopAuto(); autoTimer = setInterval(render, 8000); }
function stopAuto(){ if(autoTimer) clearInterval(autoTimer); autoTimer = null; }

render();
startAuto();
</script>
</body>
</html>
